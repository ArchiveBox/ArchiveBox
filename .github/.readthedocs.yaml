version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - uv run --no-project --with-requirements .github/docs/requirements.txt sphinx-build -W --keep-going -b html -c .github/docs . "$READTHEDOCS_OUTPUT/html"
submodules:
  include:
    - docs
python:
  install:
    - method: uv
      command: pip
      requirements: .github/docs/requirements.txt
sphinx:
  configuration: .github/docs/conf.py
  fail_on_warning: true
