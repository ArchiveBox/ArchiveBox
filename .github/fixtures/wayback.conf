map $request_uri $wayback_location {
    default "";
    ~^/save/(https?://.+)$ /web/20200101000000/$1;
}
server {
    listen 80;
    location /save/ {
        add_header Content-Location $wayback_location;
        default_type text/html;
        return 200 '<!doctype html><title>Saved</title>';
    }
    location / { return 404; }
}
