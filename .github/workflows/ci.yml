name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  prepare:
    name: Prepare the version before starting expensive jobs
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      run_tests: ${{ github.event_name != 'push' || steps.channel.outputs.stable == 'true' || steps.version.outputs.action == 'ready' || steps.version.outputs.action == 'reserved' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ github.event_name == 'push' && secrets.RELEASE_GH_TOKEN || github.token }}

      - name: Keep synchronized stable branches on the released version
        id: channel
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml | head -n 1)"
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          # Stable reconciliation may preserve dev history with a merge commit.
          # Its tree still matches main; bumping it would undo synchronization
          # before the stable publisher can advance the Docker :dev tag.
          if [[ "$GITHUB_REF_NAME" == dev && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
             git merge-base --is-ancestor "$MAIN_SHA" "$GITHUB_SHA" &&
             git diff --quiet "$MAIN_SHA" "$GITHUB_SHA"; then
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          fi

      - id: version
        if: github.event_name == 'push' && steps.channel.outputs.stable != 'true'
        uses: ArchiveBox/monorepo/.github/actions/prepare-release-version@main
        with:
          package: archivebox
          branch: ${{ github.ref_name }}
          tag-prefix: v
          version-scheme: ${{ github.ref_name == 'main' && 'patch' || 'rc' }}

  lint:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    name: Linters
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  install-cli-platform:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    name: Install and CLI platform compatibility
    uses: ./.github/workflows/test.yml
    secrets: inherit

  tests:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    name: Discovered test matrix
    uses: ./.github/workflows/test-parallel.yml
    secrets: inherit

  documentation:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    name: Documentation and root tests
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  codeql:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    secrets: inherit

  python-artifacts:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    name: Tested Python artifacts
    uses: ./.github/workflows/pip.yml
    secrets: inherit

  docker-digests:
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    name: Tested Docker images
    uses: ./.github/workflows/docker.yml
    with:
      push_digests: ${{ github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main') }}
    secrets: inherit

  required:
    name: All required CI lanes
    if: ${{ always() && needs.prepare.outputs.run_tests == 'true' }}
    needs:
      - prepare
      - lint
      - install-cli-platform
      - tests
      - documentation
      - codeql
      - python-artifacts
      - docker-digests
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every required lane succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          INSTALL_CLI_PLATFORM_RESULT: ${{ needs.install-cli-platform.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          PYTHON_ARTIFACTS_RESULT: ${{ needs.python-artifacts.result }}
          DOCKER_DIGESTS_RESULT: ${{ needs.docker-digests.result }}
        run: |
          for result in \
            "$LINT_RESULT" \
            "$INSTALL_CLI_PLATFORM_RESULT" \
            "$TESTS_RESULT" \
            "$DOCUMENTATION_RESULT" \
            "$CODEQL_RESULT" \
            "$PYTHON_ARTIFACTS_RESULT" \
            "$DOCKER_DIGESTS_RESULT"
          do
            [[ "$result" == success ]]
          done
          echo 'All required CI lanes and tested release artifacts succeeded.'
