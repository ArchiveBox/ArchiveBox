name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  prepare:
    permissions:
      contents: write
    uses: ./.github/workflows/prepare-release.yml
    secrets: inherit

  lint:
    needs: prepare
    if: needs.prepare.outputs.run_jobs == 'true'
    name: Linters
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  install-cli-platform:
    needs: prepare
    if: needs.prepare.outputs.run_jobs == 'true'
    name: Install and CLI platform compatibility
    uses: ./.github/workflows/test.yml
    secrets: inherit

  tests:
    needs: prepare
    if: needs.prepare.outputs.run_jobs == 'true'
    name: Discovered test matrix
    uses: ./.github/workflows/test-parallel.yml
    secrets: inherit

  codeql:
    needs: prepare
    if: needs.prepare.outputs.run_jobs == 'true'
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    secrets: inherit

  python-artifacts:
    needs: prepare
    if: needs.prepare.outputs.run_jobs == 'true'
    name: Tested Python artifacts
    uses: ./.github/workflows/pip.yml
    secrets: inherit

  docker-digests:
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    needs: prepare
    if: needs.prepare.outputs.run_jobs == 'true'
    name: Tested Docker images
    uses: ./.github/workflows/docker.yml
    with:
      push_digests: ${{ github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main') }}
    secrets: inherit

  dev-image:
    name: Publish early dev image
    needs: docker-digests
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    outputs:
      ready: ${{ steps.publish.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          username: archivebox
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Publish the existing universal SHA tag and opt-in dev-unstable channel
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(< /tmp/digests/source-ref)" == "$GITHUB_SHA" ]]
          mapfile -t digests < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | grep -E '^[0-9a-f]{64}$')
          [[ "${#digests[@]}" -eq 2 ]]
          for image in archivebox/archivebox ghcr.io/archivebox/archivebox; do
            refs=()
            for digest in "${digests[@]}"; do refs+=("$image@sha256:$digest"); done
            docker buildx imagetools create --tag "$image:sha-${GITHUB_SHA::12}" "${refs[@]}"
          done
          # Keep both exact SHA tags even if this build was superseded. Only
          # the current head may update the moving channel and start staging.
          head="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "Source $GITHUB_SHA superseded by $head; not promoting dev-unstable."
            exit 0
          fi
          for image in archivebox/archivebox ghcr.io/archivebox/archivebox; do
            docker buildx imagetools create --tag "$image:dev-unstable" "$image:sha-${GITHUB_SHA::12}"
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  # Cabbage follows :dev. Its exact-SHA acceptance runs after Release promotes
  # the tested image; requiring that deployment here would block promotion.
  required:
    name: All required CI lanes
    if: ${{ always() && needs.prepare.outputs.run_jobs == 'true' }}
    needs:
      - prepare
      - lint
      - install-cli-platform
      - tests
      - codeql
      - python-artifacts
      - docker-digests
      - dev-image
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every required lane succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          INSTALL_CLI_PLATFORM_RESULT: ${{ needs.install-cli-platform.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          PYTHON_ARTIFACTS_RESULT: ${{ needs.python-artifacts.result }}
          DOCKER_DIGESTS_RESULT: ${{ needs.docker-digests.result }}
          DEV_IMAGE_RESULT: ${{ needs.dev-image.result }}
        run: |
          for result in \
            "$LINT_RESULT" \
            "$INSTALL_CLI_PLATFORM_RESULT" \
            "$TESTS_RESULT" \
            "$CODEQL_RESULT" \
            "$PYTHON_ARTIFACTS_RESULT" \
            "$DOCKER_DIGESTS_RESULT"
          do
            [[ "$result" == success ]]
          done
          [[ "$DEV_IMAGE_RESULT" == success || "$DEV_IMAGE_RESULT" == skipped ]]
          echo 'All required CI lanes and tested release artifacts succeeded.'
