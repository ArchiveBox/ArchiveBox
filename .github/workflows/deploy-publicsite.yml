name: Deploy Publicsite to GitHub Pages
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ['Capture publicsite screenshots']
    types: [completed]
    branches: [dev]
permissions:
  contents: read
  actions: read
concurrency:
  group: fast-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'dev' }}
      - uses: astral-sh/setup-uv@v7
      - name: Restore latest complete screenshots
        run: uv run --no-project python bin/restore_site_screenshots.py archivebox publicsite/screenshots
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Render current gallery layout without recapturing images
        run: uv run --no-project python bin/generate_ui_screenshot_gallery.py refresh publicsite/screenshots/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicsite
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
