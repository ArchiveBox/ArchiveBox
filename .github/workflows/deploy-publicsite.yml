name: Publish website

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ['Capture publicsite screenshots']
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  actions: read

env:
  # Repository-specific output; all publication logic below is a local copy.
  SITE_OUTPUT: publicsite
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

# One production queue covers restore, build and deploy. PRs have separate queues.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || env.DEFAULT_BRANCH }}
          persist-credentials: false
      - name: Record website source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # BEGIN REPOSITORY-SPECIFIC BUILD
      - uses: astral-sh/setup-uv@v7
      - name: Restore latest complete screenshots
        run: uv run --no-project python bin/restore_site_screenshots.py archivebox publicsite/screenshots
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Render current gallery layout without recapturing images
        run: uv run --no-project python bin/generate_ui_screenshot_gallery.py refresh publicsite/screenshots/index.html
      # END REPOSITORY-SPECIFIC BUILD

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_OUTPUT }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the current default-branch revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          echo "deploy=$([ "$latest" = "$REVISION" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.deploy == 'true'
        id: deployment
