name: Publish website

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ['Capture publicsite screenshots']
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  actions: read

env:
  # Repository-specific output; all publication logic below is a local copy.
  SITE_OUTPUT: _site
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

# One production queue covers restore, build and deploy. PRs have separate queues.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    # A failed capture has no validated new artifact. Leave the published
    # gallery alone; don't make the failure look like a successful refresh.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || env.DEFAULT_BRANCH }}
          persist-credentials: false
          # Select capture artifacts by immutable Core ancestry, not finish time.
          fetch-depth: 0
      - name: Record website source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # BEGIN REPOSITORY-SPECIFIC BUILD
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          # Match core CI: the locked native dependencies support Python 3.13.
          python-version: "3.13"
      - name: Restore latest complete screenshots
        run: |
          mkdir "$RUNNER_TEMP/manual-screenshots"
          git ls-files -z 'publicsite/screenshots/*.png' | while IFS= read -r -d '' image; do
            mv "$image" "$RUNNER_TEMP/manual-screenshots/"
          done
          uv run --no-project python bin/screenshot_gallery_helpers.py restore publicsite/screenshots
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Keep manually captured screenshots
        run: |
          uv run --no-project python - <<'PY'
          import hashlib, html, json, os, re, shutil, subprocess
          from datetime import datetime
          from pathlib import Path
          directory = Path("publicsite/screenshots")
          manifest_path = directory / "build.json"
          manifest = json.loads(manifest_path.read_text())
          gallery_path = directory / "index.html"
          gallery = gallery_path.read_text()
          captures = json.loads(Path(".github/manual-screenshot-captures.json").read_text())
          def capture_time(value):
              try:
                  timestamp = datetime.fromisoformat(value)
              except (TypeError, ValueError):
                  return None
              return timestamp if timestamp.utcoffset() is not None else None

          gallery_time = capture_time(manifest.get("generated_at"))
          omitted_views = {
              view
              for outcome in manifest.get("optional_recipe_captures", {}).values()
              if outcome["status"] == "unavailable"
              for view in outcome["views"]
          }
          applied = {}
          for filename in subprocess.check_output(["git", "ls-files", "publicsite/screenshots/*.png"], text=True).splitlines():
              image = Path(filename)
              view = image.stem.rsplit("-", 1)[0]
              if view in omitted_views or (
                  view.startswith("snapshot-view-") and manifest.get("optional_provider_captures", {}).get(view.removeprefix("snapshot-view-")) == "unavailable"
              ):
                  # Provider absence is explicit: a tracked older PNG is not a fresh capture.
                  continue
              capture = captures.get(view, {})
              if image.name in manifest["files"]:
                  # Only a newer dated capture may replace a qualified image.
                  manual_time = capture_time(capture.get("captured_at"))
                  if manual_time is None or gallery_time is None or manual_time <= gallery_time:
                      continue
              shutil.copyfile(Path(os.environ["RUNNER_TEMP"]) / "manual-screenshots" / image.name, image)
              if capture:
                  applied[view] = capture
              digest = hashlib.sha256(image.read_bytes()).hexdigest()
              manifest["files"][image.name] = digest
              manifest.setdefault("manual_captures", {})[image.name] = {
                  **capture,
                  "revision": capture.get("source_revision"),
                  "source": "Browser capture of a real local ArchiveBox collection",
              }
              gallery = re.sub(re.escape(image.name) + r"(?:\?v=[a-f0-9]+)?", f"{image.name}?v={digest[:12]}", gallery)
          for view, capture in applied.items():
              def update_caption(match):
                  paragraph = re.sub(r'<a href="[^"]*"><code>.*?</code></a>', lambda _: f'<a href="{html.escape(capture["url"], quote=True)}"><code>{html.escape(capture["path"])}</code></a>', match[2], count=1)
                  paragraph = re.sub(r"~[0-9]+ms TTFB", f'~{capture["ttfb_ms"]}ms TTFB', paragraph)
                  return match[1] + paragraph + match[3]
              gallery = re.sub(r'(<article id="' + re.escape(view) + r'"><h2>.*?</h2><p>)(.*?)(</p>)', update_caption, gallery)
          manifest["capture_count"] = len(manifest["files"])
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          gallery_path.write_text(gallery)
          PY
      - name: Render current gallery layout without recapturing images
        run: uv run --no-project python bin/screenshot_gallery_helpers.py refresh publicsite/screenshots/index.html
      - name: Assemble website with the local base components
        run: uv run --no-project python .github/pages/site.py render _site --source publicsite
      # END REPOSITORY-SPECIFIC BUILD

      - name: Verify website in Chromium
        env:
          ABXPKG_LIB_DIR: ${{ runner.tool_cache }}/abxpkg/site-browser
        run: |
          # Resolve the same supported browser as captures; Playwright is the
          # driver only and must not provision a separate browser/runtime.
          # Use the verified wheel URLs/hashes in uv.lock. Fresh release pins
          # need not be visible in an ephemeral resolver's cached index yet.
          uv sync --locked --no-sources --no-install-project
          CHROME_SCHEMA="$(uv run --no-sync --no-sources python -c 'from abx_plugins import get_plugins_dir; print(get_plugins_dir() / "chrome" / "config.json")')"
          # Match test-parallel's hosted-Linux mirror preference before Chrome's apt dependencies.
          if [[ "$RUNNER_OS" == "Linux" && "$RUNNER_ENVIRONMENT" == "github-hosted" ]]; then
            if [[ -f /etc/apt/apt-mirrors.txt ]]; then
              sudo sed -Ei '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:1$|d' /etc/apt/apt-mirrors.txt
              sudo sed -Ei 's|^(https://archive\.ubuntu\.com/ubuntu/[[:space:]]+)priority:2$|\1priority:0|' /etc/apt/apt-mirrors.txt
            fi
          fi
          uv run --no-sync --no-sources abxpkg env --install --json --deps-from="$CHROME_SCHEMA:required_binaries" > "$RUNNER_TEMP/browser-env.json"
          CHROME_BINARY="$(uv run --no-sync --no-sources python -c 'import json, sys; print(json.load(open(sys.argv[1]))["CHROME_BINARY"])' "$RUNNER_TEMP/browser-env.json")"
          export CHROME_BINARY
          test -x "$CHROME_BINARY"
          uv run --no-sync --no-sources python .github/pages/verify.py "$SITE_OUTPUT" --evidence "$RUNNER_TEMP/site-evidence"
      - name: Save website verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-verification
          path: ${{ runner.temp }}/site-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_OUTPUT }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
