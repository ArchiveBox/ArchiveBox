        selected_class = live.get("selected_hash_class", 0)
        selected_ok = type(selected_class) is int and selected_class == 2
        setup = [process for process in Process.objects.all() if any(str(arg).endswith("on_CrawlSetup__80_singlefile_prepare.py") for arg in process.cmd)]
        stage_setup = [process for process in Process.objects.all() if any(str(arg).endswith("on_CrawlSetup__81_singlefile_diagnostic.py") for arg in process.cmd)]
        metrics = {
            "capture.stage_setup_count": len(stage_setup),
            "capture.stage_setup_success_count": sum(process.exit_code == 0 for process in stage_setup),
            "capture.diagnostic_hash_class": live.get("diagnostic_hash_class", 0),
            "capture.prepared_bundle_verified": int(prepared_ok and selected_ok),
            "capture.prepared_file_count": len(prepared_files),
            "capture.prepared_hash_class": prepared_class if type(prepared_class) is int and prepared_class in {0, 1, 2} else 0,
            "capture.selected_hash_class": selected_class if type(selected_class) is int and selected_class in {0, 1, 2} else 0,
            "capture.setup_process_count": len(setup),
            "capture.setup_success_count": sum(process.exit_code == 0 for process in setup),
            "capture.singlefile_succeeded": int(bool(result and result.status == "succeeded")),
            "capture.html_bytes": output.stat().st_size if output and output.is_file() else 0,
            "capture.font_count": len(fonts),
            "capture.unique_fonts": len(set(hashes)),
            "capture.font_payloads_preserved": int(font_digest == "beb4f5ebe5ec8cd10dae7f74dcc1f8b6cc7a3095550e5920d1cf951eaae8eae3"),
            "capture.public_title_preserved": int('<title>Public Access - Certificate v1 (Bleed) - 8.5 x 11"</title>' in html),
            "capture.failed_results": ArchiveResult.objects.filter(status="failed").count(),
        }
        capture_log = Path(os.environ["PUBLIC_ROOT"]) / "capture.log"
        metrics.update(classify_capture(
            ArchiveResult.objects.order_by("start_ts", "id").values_list("plugin", "status", "process__exit_code", "process__stderr"),
            capture_log.read_text(errors="replace") if capture_log.is_file() else "",
        ))
        trace_file = Path(os.environ["PUBLIC_ROOT"]) / "diagnostics/trace-state.json"
        trace_state = json.loads(trace_file.read_text()) if trace_file.is_file() else {}
        for key in ['session_created', 'started', 'data_batches', 'completed', 'stop_requested', 'detached', 'drain_error', 'disconnected']:
            value = trace_state.get(key, 0)
            metrics["trace." + key] = value if type(value) is int and value >= 0 else 0
        metrics["trace.state_present"] = int(trace_file.is_file())
        metrics["trace.gc_file_present"] = int((trace_file.parent / "v8-gc.json").is_file())
        report = Path(os.environ["PUBLIC_ROOT"]) / "diagnostics/system-memory.json"
        report.parent.mkdir(parents=True, exist_ok=True)
        report.write_text(json.dumps(metrics))
        assert metrics["capture.setup_process_count"] == 1 and metrics["capture.setup_success_count"] == 1, "Candidate CrawlSetup hook did not succeed exactly once"
        assert metrics["capture.stage_setup_count"] == metrics["capture.stage_setup_success_count"] == 1, "Stage diagnostic setup did not succeed exactly once"
        assert metrics["capture.diagnostic_hash_class"] == 2, "Stage diagnostic runtime bundle not selected"
        assert metrics["capture.prepared_bundle_verified"], "CrawlSetup did not prepare reviewed SingleFile bundle"
        assert metrics["capture.singlefile_succeeded"], "SingleFile hook did not succeed"
        assert metrics["capture.failed_results"] == 0, "Full public capture contains failed hooks"
        assert metrics["capture.html_bytes"] > 300_000_000, "Full public capture missing"
        assert metrics["capture.font_payloads_preserved"], "Public font multiset differs from intact control"
        assert metrics["capture.public_title_preserved"], "Public document title missing"
        VERIFY
        exit "$capture_status"
        PUBLIC
    - name: Record failed capture resource diagnostics
      if: always()
      run: |
        umask 077
        [[ -n "${CANVA_PUBLIC_ROOT:-}" ]] || exit 0
        uv run --no-sync python - <<'METRICS'
        import json
        import os
        from pathlib import Path

        output = Path(os.environ["CANVA_PUBLIC_ROOT"]) / "diagnostics" / "system-memory.json"
        capture = json.loads(output.read_text()) if output.is_file() else {}
        capture_keys = {"capture.prepared_file_count", "capture.prepared_hash_class", "capture.selected_hash_class", "capture.setup_process_count", "capture.setup_success_count", "capture.prepared_bundle_verified", "capture.singlefile_succeeded", "capture.html_bytes", "capture.font_count", "capture.unique_fonts", "capture.font_payloads_preserved", "capture.public_title_preserved", "capture.failed_results"}
        capture_keys.update({"capture.stage_setup_count", "capture.stage_setup_success_count", "capture.diagnostic_hash_class"})
        capture_keys.update("failure." + name for name in 'accessibility archivewebpage box calendar canva chrome chrome_mhtml consolelog defuddle dns dom drawio dropbox excalidraw figma forumdl gallerydl git googledocs googledrive hashes headers htmltotext iclouddrive iwork liteparse mercury microsoft365 miro nextcloud notion onedrive opencode opendataloader opentimestamps papersdl parse_dom_outlinks parse_html_urls parse_jsonl_urls parse_netscape_urls parse_rss_urls parse_txt_urls pdf protondocs protondrive readability redirects responses screenshot seo singlefile sslcerts staticfile title tldraw tlsnotary trafilatura wetransfer wget ytdlp'.split() + ["other"])
        capture_keys.update("indicator." + name for name in ['guard_rejected', 'renderer_crashed', 'unexpected_target_close', 'target_closed', 'timeout', 'heap_failure', 'trace_drain_failed'])
        capture_keys.update("log_indicator." + name for name in ['guard_rejected', 'renderer_crashed', 'unexpected_target_close', 'target_closed', 'timeout', 'heap_failure', 'trace_drain_failed'])
        capture_keys.update("trace." + name for name in ['session_created', 'started', 'data_batches', 'completed', 'stop_requested', 'detached', 'drain_error', 'disconnected', 'state_present', 'gc_file_present'])
        capture_keys.update({"native.crash_count", "native.error_code", "native.error_code_conflict"})
        for plugin in ("chrome", "singlefile"):
            capture_keys.update({f"process.{plugin}.count", f"process.{plugin}.missing_exit"})
            capture_keys.update(f"process.{plugin}.exit.{index}" for index in range(16))
        report = {key: value for key, value in capture.items() if key in capture_keys and type(value) is int}
        meminfo = Path("/proc/meminfo")
        if meminfo.exists():
            for line in meminfo.read_text().splitlines():
                fields = line.split()
                if fields[0] in {"MemTotal:", "MemAvailable:", "SwapTotal:", "SwapFree:"} and fields[1].isdigit():
                    report[fields[0][:-1] + "_kB"] = int(fields[1])
        cgroup = Path("/sys/fs/cgroup")
        proc = Path("/proc/self/cgroup")
        if proc.exists():
            for line in proc.read_text().splitlines():
                if line.startswith("0::"):
                    candidate = cgroup / line[3:].lstrip("/")
                    if (candidate / "memory.events").is_file():
                        cgroup = candidate
        for metric in ("memory.max", "memory.peak", "memory.swap.max", "memory.swap.peak"):
            file = cgroup / metric
            if file.is_file():
                value = file.read_text().strip()
                if value.isdigit():
                    report[metric] = int(value)
                elif value == "max":
                    report[metric] = "max"
        file = cgroup / "memory.events"
        if file.is_file():
            for line in file.read_text().splitlines():
                key, value = line.split()
                if key in {"low", "high", "max", "oom", "oom_kill", "oom_group_kill"} and value.isdigit():
                    report["memory.events." + key] = int(value)
        output = Path(os.environ["CANVA_PUBLIC_ROOT"]) / "diagnostics" / "system-memory.json"
        output.parent.mkdir(parents=True, exist_ok=True)
        with output.open("w") as stream:
            os.fchmod(stream.fileno(), 0o600)
            json.dump(report, stream, sort_keys=True)
        METRICS
    - name: Upload public diagnostics only
      if: always() && env.CANVA_PUBLIC_ROOT != ''
      uses: actions/upload-artifact@v4
      with:
        name: canva-public-native-diagnostics
        path: |-
          ${{ env.CANVA_PUBLIC_ROOT }}/diagnostics/singlefile-phases.json
          ${{ env.CANVA_PUBLIC_ROOT }}/diagnostics/v8-gc.json
          ${{ env.CANVA_PUBLIC_ROOT }}/diagnostics/system-memory.json
        retention-days: 3
        if-no-files-found: error
    - name: Remove disposable public collection
      if: always()
      run: if [[ -n "${CANVA_PUBLIC_ROOT:-}" ]]; then rm -rf -- "$CANVA_PUBLIC_ROOT"; fi
