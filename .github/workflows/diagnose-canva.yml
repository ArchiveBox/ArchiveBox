# Temporary manual-only public reference proof. No deployment or release path.
name: Diagnose isolated TLS reference
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: canva-public-native-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostics/canva-font-validation-rc78'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: '1'
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.5'
          enable-cache: 'false'
      - name: Test diagnostic contract
        run: |
          python .github/diagnostics/tls-reference/derive_requirements.py
          python .github/diagnostics/tls-reference/test_reference.py
          python .github/diagnostics/tls-reference/test_lifecycle.py
          python .github/diagnostics/tls-reference/test_baseline.py
      - name: One isolated reference attempt
        timeout-minutes: 16
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          env -i PATH="$PATH" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" PYTHONDONTWRITEBYTECODE=1 python .github/diagnostics/tls-reference/reference.py --root "$RUNNER_TEMP" --safe "$RUNNER_TEMP/tls-safe"
      - name: Always remove owned private state
        if: always()
        run: env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 python .github/diagnostics/tls-reference/cleanup.py "$RUNNER_TEMP"
      - name: Validate artifact boundary
        id: boundary
        if: always()
        run: |
          python .github/diagnostics/tls-reference/derive_requirements.py
          python .github/diagnostics/tls-reference/test_reference.py --validate "$RUNNER_TEMP/tls-safe/summary.json"
      - name: Upload sanitized evidence only
        if: always() && steps.boundary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tls-reference-sanitized
          path: ${{ runner.temp }}/tls-safe/summary.json
          if-no-files-found: error
          retention-days: 3
