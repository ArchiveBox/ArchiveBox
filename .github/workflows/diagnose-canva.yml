# Temporary public-only diagnostic. Remove after the native fatal cause is isolated.
name: Diagnose public Canva renderer crash
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: canva-public-native-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      wayback:
        image: nginx:alpine
        ports:
        - 80/tcp
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: '1'
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        version: 0.13.5
        enable-cache: 'false'
    - name: Install ArchiveBox and screenshot dependencies
      run: uv sync --no-cache --frozen
    - name: Install the matching Chrome sandbox helper
      run: |
        chrome_sandbox="$(uv run --no-cache --no-sync python - <<'PY'
        import json
        import os
        import subprocess
        from pathlib import Path
        import abx_plugins

        config = Path(abx_plugins.__file__).parent / "plugins/chrome/config.json"
        env = json.loads(subprocess.check_output([
            "abxpkg", "env", "--install", "--json",
            f"--deps-from={config}:required_binaries", "browsers",
        ], text=True))
        # CHROME_BINARY may be a provider launcher, not the native executable.
        native_chrome = subprocess.check_output([
            env["NODE_BINARY"], "-e", r"""
            const {getInstalledBrowsers, detectBrowserPlatform} = require('@puppeteer/browsers');
            const {execFileSync} = require('node:child_process');
            const version = execFileSync(process.env.CHROME_BINARY, ['--version'], {encoding: 'utf8'}).match(/\d+\.\d+\.\d+\.\d+/)[0];
            getInstalledBrowsers({cacheDir: process.env.PUPPETEER_CACHE_DIR}).then(browsers => {
                const matches = browsers.filter(b => b.browser === 'chrome' && b.buildId === version && b.platform === detectBrowserPlatform());
                if (matches.length !== 1) throw new Error('Expected exactly one matching installed Chrome');
                console.log(matches[0].executablePath);
            }).catch(error => { console.error(error); process.exit(1); });
            """,
        ], env={**os.environ, **env}, text=True).strip()
        helper = Path(native_chrome).resolve(strict=True).with_name("chrome_sandbox")
        assert helper.is_file(), helper
        print(helper)
        PY
        )"
        sudo install -o root -g root -m 4755 "$chrome_sandbox" /usr/local/sbin/archivebox-chrome-sandbox
        echo 'CHROME_DEVEL_SANDBOX=/usr/local/sbin/archivebox-chrome-sandbox' >> "$GITHUB_ENV"
        # Match plugin CI: keep software 2D rendering; emulating the whole GPU
        # can stall document exports on CPU-limited runners.
        echo 'CHROME_ARGS_EXTRA=["--use-gl=angle","--use-angle=swiftshader-webgl","--enable-unsafe-swiftshader"]' >> "$GITHUB_ENV"
    - name: Install public browser display
      run: |-
        sudo apt-get update
        sudo apt-get install -y xvfb xauth poppler-utils
    - name: Configure local Wayback submission service
      run: |
        set -Eeuo pipefail
        docker cp .github/fixtures/wayback.conf '${{ job.services.wayback.id }}:/etc/nginx/conf.d/default.conf'
        docker exec '${{ job.services.wayback.id }}' nginx -t
        docker restart '${{ job.services.wayback.id }}'
        # Docker can reassign an ephemeral host port on restart. GitHub's
        # service context retains the original port, so resolve the live mapping.
        wayback_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}' '${{ job.services.wayback.id }}')"
        save_url="http://127.0.0.1:$wayback_port/save/"
        echo "ARCHIVEDOTORG_SAVE_URL=$save_url" >> "$GITHUB_ENV"
    - name: Capture public Canva with native diagnostics
      run: |
        set -Eeuo pipefail
        umask 077
        public_root="$(mktemp -d "$RUNNER_TEMP/canva-public.XXXXXX")"
        echo "CANVA_PUBLIC_ROOT=$public_root" >> "$GITHUB_ENV"
        mkdir -p "$public_root/home" "$public_root/data" "$public_root/diagnostics"
        # Explicit allowlist: no runner tokens, auth storage, cookies or user HOME.
        env -i PATH="$GITHUB_WORKSPACE/.venv/bin:/usr/local/bin:/usr/bin:/bin" \
          HOME="$public_root/home" LANG=C.UTF-8 \
          PUBLIC_ROOT="$public_root" REPO_DIR="$GITHUB_WORKSPACE" \
          CHROME_DEVEL_SANDBOX="$CHROME_DEVEL_SANDBOX" \
          CHROME_ARGS_EXTRA="$CHROME_ARGS_EXTRA" \
          ARCHIVEDOTORG_SAVE_URL="$ARCHIVEDOTORG_SAVE_URL" \
          TIMEOUT=60 CHROME_HEADLESS=false CHROME_LOG_SUBPROCESS_OUTPUT=true \
          xvfb-run -a bash -euo pipefail <<'PUBLIC' >"$public_root/capture.log" 2>&1
        # Candidate-only source, before init/install/add launch fresh processes.
        candidate_hook="$(python -c 'from pathlib import Path; import abx_plugins; print(Path(abx_plugins.__file__).parent / "plugins/singlefile/on_CrawlSetup__80_singlefile_prepare.py")')"
        cat > "$candidate_hook" <<'CANDIDATE_HOOK'
        #!/usr/bin/env -S abxpkg run --script --deps-from=../chrome/config.json:required_binaries,./config.json:required_binaries python3
        # /// script
        # requires-python = ">=3.12"
        # ///

        """Temporarily avoid duplicate font-source serialization in SingleFile 1.36.0.

        Upstream provenance: single-file-core 79ecf4dce4acab130c0b587d8843f0328eb389f9,
        core/lib/processor-helper-common.js:getPropertyValue. The selected CSS value
        has already been generated to check the legacy \\9 suffix; reuse it rather
        than generating the same embedded font again. No font selection changes.
        Remove this hook once an upstream release includes and validates this fix.
        """

        import errno
        import hashlib
        import json
        import os
        import shutil
        import tempfile
        from pathlib import Path

        from abx_plugins.plugins.base.utils import load_config, write_text_atomic

        VERSION = "1.36.0"
        ORIGINAL_SHA256 = "386dbce9c01ecc2d4edb92fe79ab36c00e10b8794149b81a4e845fb3dcb8aac2"
        PATCHED_SHA256 = "c5010080c7826e5c7cc32e594ae718b31776845baeaba1a0481182f45dca18a9"
        BEFORE = r"getPropertyValue(e,n){let t;if(e.block.children&&(t=e.block.children.filter(e=>{try{return e.property==n&&!RN.generate(e.value).match(/\\9$/)}catch(t){return e.property==n}}).tail),t)try{return RN.generate(t.data.value)}catch(e){}}"
        AFTER = r"getPropertyValue(e,n){let t;if(e.block.children)e.block.children.forEach(e=>{if(e.property==n)try{const n=RN.generate(e.value);n.match(/\\9$/)||(t=n)}catch(e){t=void 0}});return t}"


        def prepare():
            metadata_path = (
                Path(os.environ["CHROMEWEBSTORE_EXTENSIONS_DIR"]) / "singlefile.extension.json"
            )
            metadata = json.loads(metadata_path.read_text())
            source = Path(metadata["unpacked_path"])
            manifest = json.loads((source / "manifest.json").read_text())
            if metadata["version"] != VERSION or manifest["version"] != VERSION:
                raise RuntimeError(
                    "SingleFile font serialization preparation requires reviewed release 1.36.0",
                )
            original = (source / "lib/single-file.js").read_bytes()
            if hashlib.sha256(original).hexdigest() != ORIGINAL_SHA256:
                raise RuntimeError("SingleFile 1.36.0 source bundle SHA256 mismatch")
            script = original.decode()
            if script.count(BEFORE) != 1:
                raise RuntimeError("SingleFile font serialization source anchor mismatch")
            patched = script.replace(BEFORE, AFTER).encode()
            if hashlib.sha256(patched).hexdigest() != PATCHED_SHA256:
                raise RuntimeError("SingleFile prepared bundle SHA256 mismatch")
            config = load_config()
            destination = (
                Path(config.PERSONAS_DIR) / ".singlefile" / f"{VERSION}-font-serialization1"
            )
            destination.parent.mkdir(parents=True, exist_ok=True)
            if not destination.exists():
                with tempfile.TemporaryDirectory(
                    prefix=".prepare-",
                    dir=destination.parent,
                ) as temporary:
                    staging = Path(temporary) / "extension"
                    shutil.copytree(source, staging)
                    (staging / "lib/single-file.js").write_bytes(patched)
                    try:
                        staging.rename(destination)
                    except OSError as error:
                        if error.errno not in (errno.EEXIST, errno.ENOTEMPTY):
                            raise
            if (destination / "lib/single-file.js").read_bytes() != patched:
                raise RuntimeError(
                    "Prepared SingleFile differs from reviewed font serialization fix",
                )
            prepared_path = (
                Path(config.CRAWL_DIR) / "chrome/extensions/singlefile.extension.json"
            )
            prepared_path.parent.mkdir(parents=True, exist_ok=True)
            write_text_atomic(
                prepared_path,
                json.dumps(
                    {
                        "name": "singlefile",
                        "version": VERSION,
                        "unpacked_path": str(destination.resolve()),
                    },
                ),
            )


        if __name__ == "__main__":
            prepare()
        CANDIDATE_HOOK
        python - "$candidate_hook" <<'CHECK_CANDIDATE'
        import hashlib
        import sys
        from pathlib import Path
        candidate = Path(sys.argv[1])
        assert hashlib.sha256(candidate.read_bytes()).hexdigest() == "ff1161bdefef7ae4574361ebbe68c5b4e17d654c1db7c4d7ecf3dd873c58374e", "Candidate preparation source differs from reviewed hook"
        candidate.chmod(0o755)
        CHECK_CANDIDATE
        cd "$PUBLIC_ROOT/data"
        python "$REPO_DIR/bin/generate_ui_screenshot_gallery.py" plugin-plan > "$PUBLIC_ROOT/plan.json"
        archivebox init --quick
        mapfile -t enabled < <(python -c 'import json,sys; print("\n".join(f"{p.upper()}_ENABLED=True" for p in json.load(open(sys.argv[1]))["enabled"]))' "$PUBLIC_ROOT/plan.json")
        archivebox config --set "${enabled[@]}"
        archivebox install
        python - "$(python -c 'from pathlib import Path; import abx_plugins; print(Path(abx_plugins.__file__).parent / "plugins/singlefile/singlefile_extension_save.js")')" <<'INSTRUMENT'
        from pathlib import Path
        import sys
        import os
        import json

        helper = Path(sys.argv[1])
        source = helper.read_text()
        assert "ABX_PUBLIC_PHASE" not in source, "SingleFile diagnostic anchor changed"

        def replace_once(old, new):
            global source
            assert source.count(old) == 1, "SingleFile diagnostic anchor changed"
            source = source.replace(old, new)

        replace_once('    const downloadTimeoutMs = deadline - Date.now();', r"""
            // Public diagnostic only: no options, URLs, bodies or arbitrary trace strings.
            const diagnosticPath = path.join(__PUBLIC_DIAGNOSTIC_DIRECTORY__, 'singlefile-phases.json');
            const tracePath = path.join(__PUBLIC_DIAGNOSTIC_DIRECTORY__, 'v8-gc.json');
            const phases = [];
            helperPage.on('console', message => {
              const match = /^ABX_PUBLIC_PHASE (progress|blob|chunk|chunk_end) (-?\d+) (-?\d+)$/.exec(message.text());
              if (match) {
                phases.push({phase: match[1], a: Number(match[2]), b: Number(match[3]), elapsed_ms: Date.now() - saveStartedAt});
                if (phases.length > 512) phases.shift();
                fs.writeFileSync(diagnosticPath, JSON.stringify(phases), {mode: 0o600});
              }
            });
            const trace = await page.browser().target().createCDPSession();
            const events = [];
            let omitted = 0;
            const names = new Set(['MajorGC', 'MinorGC', 'V8.GC_SCAVENGER', 'V8.GC_MARK_COMPACTOR', 'V8.GCFinalizeMC', 'V8.GCIncrementalMarking']);
            trace.on('Tracing.dataCollected', ({value}) => {
              for (const event of value) {
                if (!names.has(event.name)) continue;
                const clean = {name: event.name};
                for (const key of ['ts', 'dur', 'pid', 'tid']) if (Number.isFinite(event[key])) clean[key] = event[key];
                for (const key of ['usedHeapSizeBefore', 'usedHeapSizeAfter', 'heap_size', 'allocated']) {
                  if (Number.isFinite(event.args?.[key])) clean[key] = event.args[key];
                }
                events.push(clean);
                if (events.length > 2048) { events.shift(); omitted++; }
              }
              fs.writeFileSync(tracePath, JSON.stringify({events, omitted}), {mode: 0o600});
            });
            await trace.send('Tracing.start', {transferMode: 'ReportEvents', traceConfig: {
              recordMode: 'recordContinuously', includedCategories: ['v8', 'disabled-by-default-v8.gc'],
              excludedCategories: ['*'], traceBufferSizeInKb: 1024,
            }});
            const stopTrace = async () => {
              const completed = new Promise(resolve => trace.once('Tracing.tracingComplete', resolve));
              await trace.send('Tracing.end');
              // Diagnostic drain only, after capture ends; the capture deadline is unchanged.
              await chromeUtils.withTimeout(() => completed, 5000, 'Public trace drain exceeded 5s');
              await trace.detach();
            };
            publicDiagnosticStop = stopTrace;
            const downloadTimeoutMs = deadline - Date.now();""")
        replace_once('  let downloadedPath', '  let publicDiagnosticStop = null;\n  let downloadedPath')
        replace_once('          const onMessage = (message, sender) => {', r"""          const onMessage = (message, sender) => {
                    if (sender.tab?.id === exactTab.id) {
                      if (message.method === 'ui.processProgress' && Number.isSafeInteger(message.index) && Number.isSafeInteger(message.maxIndex)) {
                        console.log('ABX_PUBLIC_PHASE progress ' + message.index + ' ' + message.maxIndex);
                      } else if (message.method === 'downloads.download') {
                        if (message.blobURL) console.log('ABX_PUBLIC_PHASE blob 0 0');
                        else if (typeof message.content === 'string') console.log('ABX_PUBLIC_PHASE ' + (message.finished ? 'chunk_end' : 'chunk') + ' ' + message.content.length + ' 0');
                      }
                    }""")
        replace_once('      releaseSinglefileLock?.();', "      if (publicDiagnosticStop) await publicDiagnosticStop().catch(() => console.error('Public trace drain failed'));\n      releaseSinglefileLock?.();")
        source = source.replace("__PUBLIC_DIAGNOSTIC_DIRECTORY__", json.dumps(str(Path(os.environ["PUBLIC_ROOT"]) / "diagnostics")))
        helper.write_text(source)
        INSTRUMENT
        url="$(python -c 'import json,sys; print(next(e["url"] for e in json.load(open(sys.argv[1]))["examples"] if "canva" in e["plugins"]))' "$PUBLIC_ROOT/plan.json")"
        capture_status=0
        archivebox add --depth=0 --overwrite "$url" || capture_status=$?
        archivebox manage shell <<'VERIFY'
        import hashlib
        import json
        import os
        import re
        from pathlib import Path
        from archivebox.core.models import ArchiveResult

        results = ArchiveResult.objects.filter(plugin="singlefile")
        result = results.first() if results.count() == 1 else None
        output = result.output_dir / "singlefile.html" if result else None
        html = output.read_text() if output and output.is_file() else ""
        blocks = re.findall(r"@font-face\s*\{([^{}]*)\}", html, re.I)
        fonts = [value for block in blocks for value in re.findall(r"url\([\"']?(data:[^\"')\s]+)", block)]
        hashes = sorted(hashlib.sha256(value.encode()).hexdigest() for value in fonts)
        # Both successful unmodified public controls produced this same full
        # 571-font multiset (118 unique payloads), including responsive faces.
        font_digest = hashlib.sha256("\n".join(hashes).encode()).hexdigest()
        prepared_files = list(Path.cwd().glob("**/chrome/extensions/singlefile.extension.json"))
        prepared = json.loads(prepared_files[0].read_text()) if len(prepared_files) == 1 else {}
        prepared_bundle = Path(prepared["unpacked_path"]) / "lib/single-file.js" if prepared else None
        prepared_ok = bool(prepared_bundle and prepared_bundle.is_file() and hashlib.sha256(prepared_bundle.read_bytes()).hexdigest() == "c5010080c7826e5c7cc32e594ae718b31776845baeaba1a0481182f45dca18a9")
        browser_file = Path(result.snapshot.output_dir) / "chrome/browser.json" if result else None
        browser = json.loads(browser_file.read_text()) if browser_file and browser_file.is_file() else {}
        selected = [extension for extension in browser.get("extensions", []) if extension.get("name") == "singlefile"]
        selected_bundle = Path(selected[0]["unpacked_path"]) / "lib/single-file.js" if len(selected) == 1 else None
        selected_ok = bool(selected_bundle and selected_bundle.is_file() and not selected[0].get("load_error") and hashlib.sha256(selected_bundle.read_bytes()).hexdigest() == "c5010080c7826e5c7cc32e594ae718b31776845baeaba1a0481182f45dca18a9")
        metrics = {
            "capture.prepared_bundle_verified": int(prepared_ok and selected_ok),
            "capture.singlefile_succeeded": int(bool(result and result.status == "succeeded")),
            "capture.html_bytes": output.stat().st_size if output and output.is_file() else 0,
            "capture.font_count": len(fonts),
            "capture.unique_fonts": len(set(hashes)),
            "capture.font_payloads_preserved": int(font_digest == "beb4f5ebe5ec8cd10dae7f74dcc1f8b6cc7a3095550e5920d1cf951eaae8eae3"),
            "capture.public_title_preserved": int('<title>Public Access - Certificate v1 (Bleed) - 8.5 x 11"</title>' in html),
            "capture.failed_results": ArchiveResult.objects.filter(status="failed").count(),
        }
        report = Path(os.environ["PUBLIC_ROOT"]) / "diagnostics/system-memory.json"
        report.parent.mkdir(parents=True, exist_ok=True)
        report.write_text(json.dumps(metrics))
        assert metrics["capture.prepared_bundle_verified"], "CrawlSetup did not prepare reviewed SingleFile bundle"
        assert metrics["capture.singlefile_succeeded"], "SingleFile hook did not succeed"
        assert metrics["capture.html_bytes"] > 300_000_000, "Full public capture missing"
        assert metrics["capture.font_payloads_preserved"], "Public font multiset differs from intact control"
        assert metrics["capture.public_title_preserved"], "Public document title missing"
        VERIFY
        exit "$capture_status"
        PUBLIC
    - name: Record failed capture resource diagnostics
      if: always()
      run: |
        umask 077
        [[ -n "${CANVA_PUBLIC_ROOT:-}" ]] || exit 0
        uv run --no-sync python - <<'METRICS'
        import json
        import os
        from pathlib import Path

        output = Path(os.environ["CANVA_PUBLIC_ROOT"]) / "diagnostics" / "system-memory.json"
        capture = json.loads(output.read_text()) if output.is_file() else {}
        capture_keys = {"capture.prepared_bundle_verified", "capture.singlefile_succeeded", "capture.html_bytes", "capture.font_count", "capture.unique_fonts", "capture.font_payloads_preserved", "capture.public_title_preserved", "capture.failed_results"}
        report = {key: value for key, value in capture.items() if key in capture_keys and type(value) is int and value >= 0}
        meminfo = Path("/proc/meminfo")
        if meminfo.exists():
            for line in meminfo.read_text().splitlines():
                fields = line.split()
                if fields[0] in {"MemTotal:", "MemAvailable:", "SwapTotal:", "SwapFree:"} and fields[1].isdigit():
                    report[fields[0][:-1] + "_kB"] = int(fields[1])
        cgroup = Path("/sys/fs/cgroup")
        proc = Path("/proc/self/cgroup")
        if proc.exists():
            for line in proc.read_text().splitlines():
                if line.startswith("0::"):
                    candidate = cgroup / line[3:].lstrip("/")
                    if (candidate / "memory.events").is_file():
                        cgroup = candidate
        for metric in ("memory.max", "memory.peak", "memory.swap.max", "memory.swap.peak"):
            file = cgroup / metric
            if file.is_file():
                value = file.read_text().strip()
                if value.isdigit():
                    report[metric] = int(value)
                elif value == "max":
                    report[metric] = "max"
        file = cgroup / "memory.events"
        if file.is_file():
            for line in file.read_text().splitlines():
                key, value = line.split()
                if key in {"low", "high", "max", "oom", "oom_kill", "oom_group_kill"} and value.isdigit():
                    report["memory.events." + key] = int(value)
        output = Path(os.environ["CANVA_PUBLIC_ROOT"]) / "diagnostics" / "system-memory.json"
        output.parent.mkdir(parents=True, exist_ok=True)
        with output.open("w") as stream:
            os.fchmod(stream.fileno(), 0o600)
            json.dump(report, stream, sort_keys=True)
        METRICS
    - name: Upload public diagnostics only
      if: always() && env.CANVA_PUBLIC_ROOT != ''
      uses: actions/upload-artifact@v4
      with:
        name: canva-public-native-diagnostics
        path: |-
          ${{ env.CANVA_PUBLIC_ROOT }}/diagnostics/singlefile-phases.json
          ${{ env.CANVA_PUBLIC_ROOT }}/diagnostics/v8-gc.json
          ${{ env.CANVA_PUBLIC_ROOT }}/diagnostics/system-memory.json
        retention-days: 3
        if-no-files-found: error
    - name: Remove disposable public collection
      if: always()
      run: if [[ -n "${CANVA_PUBLIC_ROOT:-}" ]]; then rm -rf -- "$CANVA_PUBLIC_ROOT"; fi
