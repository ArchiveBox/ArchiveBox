name: Measure parallel gallery CI

on:
  workflow_dispatch:
  push:
    branches: [codex/gallery-parallel-timing]
    paths:
      - .github/workflows/gallery-shard-pilot.yml
      - bin/measure_gallery_shards.py

permissions:
  contents: read
  actions: read

# Pilot only, isolated from the production gallery's queue and Pages trigger.
concurrency:
  group: gallery-shard-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: pilot-${{ matrix.lane }}
    if: github.ref == 'refs/heads/codex/gallery-parallel-timing'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: serial
            plugins: git,packageregistry
          - lane: git
            plugins: git
          - lane: packageregistry
            plugins: packageregistry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install locked gallery dependencies
        run: uv sync --no-cache --frozen
      - name: Install the matching Chrome sandbox helper
        run: |
          # Match test-parallel's hosted-Linux mirror preference before Chrome's apt dependencies.
          if [[ "$RUNNER_OS" == "Linux" && "$RUNNER_ENVIRONMENT" == "github-hosted" ]]; then
            if [[ -f /etc/apt/apt-mirrors.txt ]]; then
              sudo sed -Ei '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:1$|d' /etc/apt/apt-mirrors.txt
              sudo sed -Ei 's|^(https://archive\.ubuntu\.com/ubuntu/[[:space:]]+)priority:2$|\1priority:0|' /etc/apt/apt-mirrors.txt
            fi
          fi
          chrome_sandbox="$(uv run --no-cache --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import abx_plugins

          config = Path(abx_plugins.__file__).parent / "plugins/chrome/config.json"
          env = json.loads(subprocess.check_output([
              "abxpkg", "env", "--install", "--json",
              f"--deps-from={config}:required_binaries", "browsers",
          ], text=True))
          # CHROME_BINARY may be a provider launcher, not the native executable.
          native_chrome = subprocess.check_output([
              env["NODE_BINARY"], "-e", r"""
              const {getInstalledBrowsers, detectBrowserPlatform} = require('@puppeteer/browsers');
              const {execFileSync} = require('node:child_process');
              const version = execFileSync(process.env.CHROME_BINARY, ['--version'], {encoding: 'utf8'}).match(/\d+\.\d+\.\d+\.\d+/)[0];
              getInstalledBrowsers({cacheDir: process.env.PUPPETEER_CACHE_DIR}).then(browsers => {
                  const matches = browsers.filter(b => b.browser === 'chrome' && b.buildId === version && b.platform === detectBrowserPlatform());
                  if (matches.length !== 1) throw new Error('Expected exactly one matching installed Chrome');
                  console.log(matches[0].executablePath);
              }).catch(error => { console.error(error); process.exit(1); });
              """,
          ], env={**os.environ, **env}, text=True).strip()
          helper = Path(native_chrome).resolve(strict=True).with_name("chrome_sandbox")
          assert helper.is_file(), helper
          print(helper)
          PY
          )"
          sudo install -o root -g root -m 4755 "$chrome_sandbox" /usr/local/sbin/archivebox-chrome-sandbox
          echo 'CHROME_DEVEL_SANDBOX=/usr/local/sbin/archivebox-chrome-sandbox' >> "$GITHUB_ENV"
          # Match plugin CI: keep software 2D rendering; emulating the whole GPU
          # can stall document exports on CPU-limited runners.
          echo 'CHROME_ARGS_EXTRA=["--use-gl=angle","--use-angle=swiftshader-webgl","--enable-unsafe-swiftshader"]' >> "$GITHUB_ENV"

      - name: Install screenshot display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth poppler-utils

      - name: Capture anonymous native provider fixture
        env:
          BASE_URL: http://archivebox.localhost:5797
          CHROME_HEADLESS: 'false'
          # Both treatments use both native flags. UI_SCREENSHOT_PLUGINS
          # chooses only the recipe views presented by the real collector.
          GIT_ENABLED: 'True'
          PACKAGEREGISTRY_ENABLED: 'True'
          ARCHIVEDOTORG_ENABLED: 'False'
          UI_SCREENSHOT_PLUGINS: ${{ matrix.plugins }}
          UI_SCREENSHOT_DATA_DIR: ${{ runner.temp }}/pilot-data
          UI_SCREENSHOT_OUTPUT_DIR: ${{ runner.temp }}/pilot-docs/screenshots
          UI_SCREENSHOT_PUBLIC_OUTPUT_DIR: ${{ runner.temp }}/pilot-public
        run: xvfb-run -a bin/collect_ui_screenshots.sh

      - name: Validate exact pilot coverage and package evidence
        env:
          PILOT_LANE: ${{ matrix.lane }}
        run: uv run --no-sync python bin/measure_gallery_shards.py collect "$PILOT_LANE" "$RUNNER_TEMP/pilot-public" "$RUNNER_TEMP/pilot-evidence"

      - name: Upload pilot evidence, never a site-screenshots artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-shard-pilot-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/pilot-evidence
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gallery-shard-pilot-${{ github.run_attempt }}-*
          path: pilot-evidence
      - name: Verify fair same-run comparison and report hosted wall time
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/measure_gallery_shards.py compare pilot-evidence
