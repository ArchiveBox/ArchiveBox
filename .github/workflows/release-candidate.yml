name: Release candidate

on:
  push:
    branches: [dev]

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-candidate-dev
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      action: ${{ steps.version.outputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.RELEASE_GH_TOKEN }}

      - name: Keep synchronized stable branches on the released version
        id: channel
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml | head -n 1)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$MAIN_SHA" == "$GITHUB_SHA" ]]; then
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          fi

      - id: version
        if: steps.channel.outputs.stable != 'true'
        uses: ArchiveBox/monorepo/.github/actions/prepare-release-version@main
        with:
          package: archivebox
          branch: dev
          tag-prefix: v
          version-scheme: rc

  python-artifacts:
    needs: prepare
    if: needs.prepare.outputs.action == 'ready' || needs.prepare.outputs.action == 'reserved'
    uses: ./.github/workflows/pip.yml
    with:
      full_tests: false
    secrets: inherit

  docker-digests:
    needs: prepare
    if: needs.prepare.outputs.action == 'ready' || needs.prepare.outputs.action == 'reserved'
    uses: ./.github/workflows/docker.yml
    with:
      push_digests: true
      full_tests: false
    secrets: inherit

  opencode:
    needs: prepare
    if: needs.prepare.outputs.action == 'ready' || needs.prepare.outputs.action == 'reserved'
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - archivebox/tests/test_opencode_agent.py
          - archivebox/tests/test_opencode_browser.py
    uses: ./.github/workflows/test-parallel.yml
    with:
      test_file: ${{ matrix.test_file }}
    secrets: inherit
