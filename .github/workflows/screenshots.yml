name: Capture publicsite screenshots

on:
  # UI/capture repairs refresh the gallery immediately; dependency/version bots
  # retain the scheduled path rather than starting another full provider capture.
  push:
    branches: [dev]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'bin/take_screenshot.js'
      - 'bin/collect_ui_screenshots.sh'
      - 'bin/generate_ui_screenshot_gallery.py'
      - 'archivebox/templates/**'
      - 'archivebox/core/templatetags/core_tags.py'
  schedule:
    - cron: '37 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      key: ${{ steps.check.outputs.key }}
    steps:
      - id: check
        uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main

  deploy:
    needs: changes
    if: needs.changes.outputs.changed == 'true' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: provider-capture
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Install ArchiveBox and screenshot dependencies
        run: uv sync --no-cache --frozen

      - name: Install the matching Chrome sandbox helper
        run: |
          chrome_sandbox="$(uv run --no-cache --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import abx_plugins

          config = Path(abx_plugins.__file__).parent / "plugins/chrome/config.json"
          env = json.loads(subprocess.check_output([
              "abxpkg", "env", "--install", "--json",
              f"--deps-from={config}:required_binaries", "browsers",
          ], text=True))
          # CHROME_BINARY may be a provider launcher, not the native executable.
          native_chrome = subprocess.check_output([
              env["NODE_BINARY"], "-e", r"""
              const {getInstalledBrowsers, detectBrowserPlatform} = require('@puppeteer/browsers');
              const {execFileSync} = require('node:child_process');
              const version = execFileSync(process.env.CHROME_BINARY, ['--version'], {encoding: 'utf8'}).match(/\d+\.\d+\.\d+\.\d+/)[0];
              getInstalledBrowsers({cacheDir: process.env.PUPPETEER_CACHE_DIR}).then(browsers => {
                  const matches = browsers.filter(b => b.browser === 'chrome' && b.buildId === version && b.platform === detectBrowserPlatform());
                  if (matches.length !== 1) throw new Error('Expected exactly one matching installed Chrome');
                  console.log(matches[0].executablePath);
              }).catch(error => { console.error(error); process.exit(1); });
              """,
          ], env={**os.environ, **env}, text=True).strip()
          helper = Path(native_chrome).resolve(strict=True).with_name("chrome_sandbox")
          assert helper.is_file(), helper
          print(helper)
          PY
          )"
          sudo install -o root -g root -m 4755 "$chrome_sandbox" /usr/local/sbin/archivebox-chrome-sandbox
          echo 'CHROME_DEVEL_SANDBOX=/usr/local/sbin/archivebox-chrome-sandbox' >> "$GITHUB_ENV"
          # Match plugin CI: keep software 2D rendering; emulating the whole GPU
          # can stall document exports on CPU-limited runners.
          echo 'CHROME_ARGS_EXTRA=["--use-gl=angle","--use-angle=swiftshader-webgl","--enable-unsafe-swiftshader"]' >> "$GITHUB_ENV"

      - name: Prepare authorized provider persona and browser display
        env:
          PROVIDER_AUTH_STORAGE_JSON: ${{ secrets.PROVIDER_AUTH_STORAGE_JSON }}
          FIGMA_AUTH_STORAGE_JSON: ${{ secrets.FIGMA_AUTH_STORAGE_JSON }}
        run: |
          set -Eeuo pipefail
          test -n "$PROVIDER_AUTH_STORAGE_JSON"
          umask 077
          auth_file="$RUNNER_TEMP/provider-auth.json"
          printf '%s' "$PROVIDER_AUTH_STORAGE_JSON" > "$auth_file"
          # The filtered Figma refresh must not replace other providers' sessions.
          uv run --no-project python - "$auth_file" <<'PYAUTH'
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          refresh = os.environ.get("FIGMA_AUTH_STORAGE_JSON")
          if refresh:
              path = Path(sys.argv[1])
              original = json.loads(path.read_text())
              figma = json.loads(refresh)
              assert figma.get("SOURCE") == "archivebox-browser-extension", "Expected Figma extension export"

              def is_figma(item, key):
                  value = item.get(key) or item.get("url") or ""
                  host = urlsplit(value if "://" in value else "//" + value.lstrip(".")).hostname or ""
                  return host == "figma.com" or host.endswith(".figma.com")

              for field, key in (("cookies", "domain"), ("origins", "origin"), ("tabs", "url")):
                  incoming = [item for item in figma.get(field, []) if is_figma(item, key)]
                  if field == "cookies" and original.get("SOURCE") != "archivebox-browser-extension":
                      # Match Chrome's extension-to-CDP import without changing old cookies.
                      converted = []
                      for cookie in incoming:
                          assert not cookie.get("partitionKey"), "Partitioned extension cookies are unsupported"
                          item = {key: cookie[key] for key in ("name", "value", "domain", "path", "secure", "httpOnly") if key in cookie}
                          if cookie.get("expirationDate") is not None:
                              item["expires"] = cookie["expirationDate"]
                          same_site = str(cookie.get("sameSite") or "").lower()
                          if same_site and same_site != "unspecified":
                              item["sameSite"] = {"no_restriction": "None", "none": "None", "lax": "Lax", "strict": "Strict"}[same_site]
                          converted.append(item)
                      incoming = converted
                  original[field] = [item for item in original.get(field, []) if not is_figma(item, key)] + incoming
              path.write_text(json.dumps(original))
          PYAUTH
          sudo apt-get update
          sudo apt-get install -y xvfb xauth poppler-utils

      - name: Build UI screenshot gallery
        run: xvfb-run -a bin/collect_ui_screenshots.sh
        env:
          BASE_URL: http://archivebox.localhost:5797
          AUTH_STORAGE_FILE: ${{ runner.temp }}/provider-auth.json
          CHROME_HEADLESS: "false"
          UI_SCREENSHOT_DATA_DIR: ${{ runner.temp }}/provider-gallery-data
          SCREENSHOT_FAILURE_DIR: ${{ runner.temp }}/gallery-failure-diagnostics

      - name: Verify gallery was generated from this exact revision
        run: |
          uv run --no-cache --no-sync python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          provenance = json.loads(Path("publicsite/screenshots/build.json").read_text())
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert provenance["revision"] == os.environ["GITHUB_SHA"], provenance
          assert provenance["version"] == version, provenance
          assert provenance["capture_count"] >= 3 * 35, provenance
          assert len(provenance["files"]) == provenance["capture_count"], provenance
          assert all(not re.match(r"^\d+-", name) for name in provenance["files"]), provenance
          PY

      - name: Save validated screenshots
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: publicsite/screenshots
          if-no-files-found: error
          retention-days: 90

      - name: Retain failed gallery frame and request diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-failure-diagnostics
          path: ${{ runner.temp }}/gallery-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove provider persona and browser profiles
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/provider-auth.json"
          rm -rf "$RUNNER_TEMP/provider-gallery-data"

  complete:
    name: 'Scheduled inputs: ${{ needs.changes.outputs.key }}'
    needs: [changes, deploy]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled work completed successfully.'
