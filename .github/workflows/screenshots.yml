name: Capture publicsite screenshots

on:
  # UI/capture repairs refresh the gallery immediately; dependency/version bots
  # retain the scheduled path rather than starting another full provider capture.
  push:
    branches: [dev]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'bin/take_screenshot.js'
      - 'bin/setup_ui_screenshot_data.js'
      - 'archivebox/api/**'
      - 'archivebox/domains/**'
      - 'archivebox/core/library*'
      - 'archivebox/core/admin*'
      - 'archivebox/core/models.py'
      - 'bin/collect_ui_screenshots.sh'
      - 'bin/assemble_screenshot_gallery.py'
      - 'bin/generate_ui_screenshot_gallery.py'
      - 'archivebox/templates/**'
      - 'archivebox/core/templatetags/core_tags.py'
  schedule:
    - cron: '37 5,17 * * *'
  workflow_dispatch:
    inputs:
      plugin_revision:
        description: Full abx-plugins main revision to capture before its release
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # Finish the current automatic capture; only the latest waiting push remains.
  # Scheduled checks cannot replace a waiting push, even when they do no work.
  # Explicit manual captures retain their own per-run group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}-{1}', inputs.plugin_revision != '' && 'plugin-capture' || 'default', github.run_id) || github.event_name == 'schedule' && 'scheduled' || 'default' }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      key: ${{ steps.check.outputs.key }}
    steps:
      - id: check
        uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main

  public_recipes:
    name: Gallery public recipe /${{ matrix.lane }}
    needs: changes
    if: needs.changes.outputs.changed == 'true' && github.ref == 'refs/heads/dev' && inputs.plugin_revision == ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: git
            plugins: git
          - lane: packageregistry
            plugins: packageregistry
          - lane: papersdl
            plugins: papersdl
          - lane: staticfile
            plugins: staticfile
          - lane: ytdlp
            plugins: ytdlp
          - lane: cad
            plugins: caddl
          - lane: boards
            plugins: drawio,excalidraw,tldraw
          - lane: documents
            plugins: calendar,liteparse,opendataloader,podcast_archiver
          - lane: parsers
            plugins: parse_jsonl_urls,parse_netscape_urls,parse_rss_urls,sourcemaps
          - lane: web
            plugins: forumdl,gallerydl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install locked gallery dependencies
        run: uv sync --no-cache --frozen
      - name: Install the matching Chrome sandbox helper
        run: |
          # Match test-parallel's hosted-Linux mirror preference before Chrome's apt dependencies.
          if [[ "$RUNNER_OS" == "Linux" && "$RUNNER_ENVIRONMENT" == "github-hosted" ]]; then
            if [[ -f /etc/apt/apt-mirrors.txt ]]; then
              sudo sed -Ei '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:1$|d' /etc/apt/apt-mirrors.txt
              sudo sed -Ei 's|^(https://archive\.ubuntu\.com/ubuntu/[[:space:]]+)priority:2$|\1priority:0|' /etc/apt/apt-mirrors.txt
            fi
          fi
          chrome_sandbox="$(uv run --no-cache --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import abx_plugins

          config = Path(abx_plugins.__file__).parent / "plugins/chrome/config.json"
          env = json.loads(subprocess.check_output([
              "abxpkg", "env", "--install", "--json",
              f"--deps-from={config}:required_binaries", "browsers",
          ], text=True))
          # CHROME_BINARY may be a provider launcher, not the native executable.
          native_chrome = subprocess.check_output([
              env["NODE_BINARY"], "-e", r"""
              const {getInstalledBrowsers, detectBrowserPlatform} = require('@puppeteer/browsers');
              const {execFileSync} = require('node:child_process');
              const version = execFileSync(process.env.CHROME_BINARY, ['--version'], {encoding: 'utf8'}).match(/\d+\.\d+\.\d+\.\d+/)[0];
              getInstalledBrowsers({cacheDir: process.env.PUPPETEER_CACHE_DIR}).then(browsers => {
                  const matches = browsers.filter(b => b.browser === 'chrome' && b.buildId === version && b.platform === detectBrowserPlatform());
                  if (matches.length !== 1) throw new Error('Expected exactly one matching installed Chrome');
                  console.log(matches[0].executablePath);
              }).catch(error => { console.error(error); process.exit(1); });
              """,
          ], env={**os.environ, **env}, text=True).strip()
          helper = Path(native_chrome).resolve(strict=True).with_name("chrome_sandbox")
          assert helper.is_file(), helper
          print(helper)
          PY
          )"
          sudo install -o root -g root -m 4755 "$chrome_sandbox" /usr/local/sbin/archivebox-chrome-sandbox
          echo 'CHROME_DEVEL_SANDBOX=/usr/local/sbin/archivebox-chrome-sandbox' >> "$GITHUB_ENV"
          # Match plugin CI: keep software 2D rendering; emulating the whole GPU
          # can stall document exports on CPU-limited runners.
          echo 'CHROME_ARGS_EXTRA=["--use-gl=angle","--use-angle=swiftshader-webgl","--enable-unsafe-swiftshader"]' >> "$GITHUB_ENV"

      - name: Install screenshot display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth poppler-utils

      - name: Capture native public recipe
        run: |
          # Match the tested compound-view experiment without changing the
          # existing five singleton jobs' default extractor configuration.
          case "$PUBLIC_RECIPE" in
            cad|boards|documents|parsers|web) export OPENDATALOADER_ENABLED=True ;;
          esac
          xvfb-run -a bin/collect_ui_screenshots.sh
        env:
          PUBLIC_RECIPE: ${{ matrix.lane }}
          BASE_URL: http://archivebox.localhost:5797
          CHROME_HEADLESS: 'false'
          ARCHIVEDOTORG_ENABLED: 'False'
          GIT_ENABLED: 'True'
          PACKAGEREGISTRY_ENABLED: 'True'
          PAPERSDL_ENABLED: 'True'
          STATICFILE_ENABLED: 'True'
          YTDLP_ENABLED: 'True'
          UI_SCREENSHOT_PLUGINS: ${{ matrix.plugins }}
          UI_SCREENSHOT_DATA_DIR: ${{ runner.temp }}/public-recipe-data
          UI_SCREENSHOT_OUTPUT_DIR: ${{ runner.temp }}/public-recipe-docs/screenshots
          UI_SCREENSHOT_PUBLIC_OUTPUT_DIR: ${{ runner.temp }}/public-recipe-png
          UI_SCREENSHOT_MANIFEST_OUT: ${{ runner.temp }}/public-recipe-capture.jsonl

      - name: Validate and package native public recipe
        env:
          PUBLIC_RECIPE: ${{ matrix.lane }}
        run: |
          uv run --no-sync python bin/assemble_screenshot_gallery.py pack "$PUBLIC_RECIPE" \
            "$RUNNER_TEMP/public-recipe-capture.jsonl" "$RUNNER_TEMP/public-recipe-png" "$RUNNER_TEMP/public-recipe-bundle"

      - name: Upload anonymous capture shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-capture-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/public-recipe-bundle
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: changes
    # All automatic/manual/plugin captures share the provider persona serially.
    # Keep explicitly requested pending jobs instead of replacing them.
    concurrency:
      group: gallery-provider-capture-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    if: (needs.changes.outputs.changed == 'true' || inputs.plugin_revision != '') && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: provider-capture
    services:
      wayback:
        image: nginx:alpine
        ports:
          - 80/tcp
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Validate plugin revision
        if: inputs.plugin_revision != ''
        env:
          PLUGIN_REVISION: ${{ inputs.plugin_revision }}
        run: '[[ "$PLUGIN_REVISION" =~ ^[0-9a-f]{40}$ ]]'

      - name: Checkout plugin revision
        if: inputs.plugin_revision != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchiveBox/abx-plugins
          ref: ${{ inputs.plugin_revision }}
          fetch-depth: 0
          path: .gallery-plugins

      - name: Use plugin revision for this capture
        if: inputs.plugin_revision != ''
        env:
          PLUGIN_REVISION: ${{ inputs.plugin_revision }}
        run: |
          set -Eeuo pipefail
          git -C .gallery-plugins fetch origin main
          test "$(git -C .gallery-plugins rev-parse HEAD)" = "$PLUGIN_REVISION"
          git -C .gallery-plugins merge-base --is-ancestor HEAD FETCH_HEAD
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.gallery-plugins" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Install ArchiveBox and screenshot dependencies
        run: uv sync --no-cache --frozen

      - name: Verify plugin capture source imports
        if: inputs.plugin_revision != ''
        run: |
          uv run --no-sync python - <<'PY'
          import os, sys
          from pathlib import Path
          import abx_dl.models, abx_plugins, abxpkg, abxbus
          root = Path(os.environ["GITHUB_WORKSPACE"])
          for module in (abx_dl.models, abx_plugins, abxpkg, abxbus):
              path = Path(module.__file__).resolve()
              print(f"{module.__name__}: {path}")
              expected = root / ".gallery-plugins" if module is abx_plugins else Path(sys.prefix).resolve()
              assert path.is_relative_to(expected), path
          assert "app_module" in abx_dl.models.PluginConfig.model_fields
          PY

      - name: Install the matching Chrome sandbox helper
        run: |
          # Match test-parallel's hosted-Linux mirror preference before Chrome's apt dependencies.
          if [[ "$RUNNER_OS" == "Linux" && "$RUNNER_ENVIRONMENT" == "github-hosted" ]]; then
            if [[ -f /etc/apt/apt-mirrors.txt ]]; then
              sudo sed -Ei '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:1$|d' /etc/apt/apt-mirrors.txt
              sudo sed -Ei 's|^(https://archive\.ubuntu\.com/ubuntu/[[:space:]]+)priority:2$|\1priority:0|' /etc/apt/apt-mirrors.txt
            fi
          fi
          chrome_sandbox="$(uv run --no-cache --no-sync python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import abx_plugins

          config = Path(abx_plugins.__file__).parent / "plugins/chrome/config.json"
          env = json.loads(subprocess.check_output([
              "abxpkg", "env", "--install", "--json",
              f"--deps-from={config}:required_binaries", "browsers",
          ], text=True))
          # CHROME_BINARY may be a provider launcher, not the native executable.
          native_chrome = subprocess.check_output([
              env["NODE_BINARY"], "-e", r"""
              const {getInstalledBrowsers, detectBrowserPlatform} = require('@puppeteer/browsers');
              const {execFileSync} = require('node:child_process');
              const version = execFileSync(process.env.CHROME_BINARY, ['--version'], {encoding: 'utf8'}).match(/\d+\.\d+\.\d+\.\d+/)[0];
              getInstalledBrowsers({cacheDir: process.env.PUPPETEER_CACHE_DIR}).then(browsers => {
                  const matches = browsers.filter(b => b.browser === 'chrome' && b.buildId === version && b.platform === detectBrowserPlatform());
                  if (matches.length !== 1) throw new Error('Expected exactly one matching installed Chrome');
                  console.log(matches[0].executablePath);
              }).catch(error => { console.error(error); process.exit(1); });
              """,
          ], env={**os.environ, **env}, text=True).strip()
          helper = Path(native_chrome).resolve(strict=True).with_name("chrome_sandbox")
          assert helper.is_file(), helper
          print(helper)
          PY
          )"
          sudo install -o root -g root -m 4755 "$chrome_sandbox" /usr/local/sbin/archivebox-chrome-sandbox
          echo 'CHROME_DEVEL_SANDBOX=/usr/local/sbin/archivebox-chrome-sandbox' >> "$GITHUB_ENV"
          # Match plugin CI: keep software 2D rendering; emulating the whole GPU
          # can stall document exports on CPU-limited runners.
          echo 'CHROME_ARGS_EXTRA=["--use-gl=angle","--use-angle=swiftshader-webgl","--enable-unsafe-swiftshader"]' >> "$GITHUB_ENV"

      - name: Prepare authorized provider persona and browser display
        env:
          PROVIDER_AUTH_STORAGE_JSON: ${{ secrets.PROVIDER_AUTH_STORAGE_JSON }}
          FIGMA_AUTH_STORAGE_JSON: ${{ secrets.FIGMA_AUTH_STORAGE_JSON }}
          CANVA_AUTH_STORAGE_JSON: ${{ secrets.CANVA_AUTH_STORAGE_JSON }}
        run: |
          set -Eeuo pipefail
          test -n "$PROVIDER_AUTH_STORAGE_JSON"
          umask 077
          auth_file="$RUNNER_TEMP/provider-auth.json"
          printf '%s' "$PROVIDER_AUTH_STORAGE_JSON" > "$auth_file"
          # Provider-specific refreshes must preserve unrelated sessions.
          uv run --no-project python - "$auth_file" <<'PYAUTH'
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path(sys.argv[1])
          original = json.loads(path.read_text())
          for secret, domain in (("FIGMA_AUTH_STORAGE_JSON", "figma.com"), ("CANVA_AUTH_STORAGE_JSON", "canva.com")):
              refresh = os.environ.get(secret)
              if not refresh:
                  continue
              provider = json.loads(refresh)

              # Both browser storage exports and extension exports are accepted
              # by Chrome. Normalize extension cookies before combining formats.
              for auth in (original, provider):
                  assert isinstance(auth.get("cookies", []), list), "Expected a cookies array"
                  if auth.get("SOURCE") != "archivebox-browser-extension":
                      continue
                  converted = []
                  for cookie in auth.get("cookies", []):
                      assert not cookie.get("partitionKey"), "Partitioned extension cookies are unsupported"
                      item = {key: cookie[key] for key in ("name", "value", "domain", "path", "secure", "httpOnly") if key in cookie}
                      if cookie.get("expirationDate") is not None:
                          item["expires"] = cookie["expirationDate"]
                      same_site = str(cookie.get("sameSite") or "").lower()
                      if same_site and same_site != "unspecified":
                          item["sameSite"] = {"no_restriction": "None", "none": "None", "lax": "Lax", "strict": "Strict"}[same_site]
                      converted.append(item)
                  if "cookies" in auth:
                      auth["cookies"] = converted
                  auth.pop("SOURCE")

              def is_provider(item, key):
                  value = item.get(key) or item.get("url") or ""
                  host = urlsplit(value if "://" in value else "//" + value.lstrip(".")).hostname or ""
                  return host == domain or host.endswith("." + domain)

              for field, key in (("cookies", "domain"), ("origins", "origin"), ("tabs", "url")):
                  if field not in provider:
                      continue
                  incoming = [item for item in provider.get(field, []) if is_provider(item, key)]
                  original[field] = [item for item in original.get(field, []) if not is_provider(item, key)] + incoming
              path.write_text(json.dumps(original))
          PYAUTH
          sudo apt-get update
          sudo apt-get install -y xvfb xauth poppler-utils

      - name: Configure local Wayback submission service
        run: |
          set -Eeuo pipefail
          docker cp .github/fixtures/wayback.conf '${{ job.services.wayback.id }}:/etc/nginx/conf.d/default.conf'
          docker exec '${{ job.services.wayback.id }}' nginx -t
          docker restart '${{ job.services.wayback.id }}'
          # Docker can reassign an ephemeral host port on restart. GitHub's
          # service context retains the original port, so resolve the live mapping.
          wayback_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}' '${{ job.services.wayback.id }}')"
          save_url="http://127.0.0.1:$wayback_port/save/"
          echo "ARCHIVEDOTORG_SAVE_URL=$save_url" >> "$GITHUB_ENV"

      - name: Build UI screenshot gallery
        run: xvfb-run -a bin/collect_ui_screenshots.sh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UI_SCREENSHOT_AI_MODEL: openai/gpt-5.4-mini
          BASE_URL: http://archivebox.localhost:5797
          AUTH_STORAGE_FILE: ${{ runner.temp }}/provider-auth.json
          CHROME_HEADLESS: "false"
          UI_SCREENSHOT_DATA_DIR: ${{ runner.temp }}/provider-gallery-data
          SCREENSHOT_FAILURE_DIR: ${{ runner.temp }}/gallery-failure-diagnostics
          UI_SCREENSHOT_SPLIT_PUBLIC: ${{ inputs.plugin_revision == '' && '1' || '0' }}
          UI_SCREENSHOT_MANIFEST_OUT: ${{ runner.temp }}/base-capture.jsonl

      - name: Validate and package the native base captures
        if: inputs.plugin_revision == ''
        run: |
          uv run --no-sync python bin/assemble_screenshot_gallery.py pack base \
            "$RUNNER_TEMP/base-capture.jsonl" publicsite/screenshots "$RUNNER_TEMP/base-bundle"

      - name: Upload native base capture shard
        if: inputs.plugin_revision == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-capture-${{ github.run_attempt }}-base
          path: ${{ runner.temp }}/base-bundle
          if-no-files-found: error
          retention-days: 7

      - name: Record plugin capture revisions
        if: inputs.plugin_revision != ''
        env:
          PLUGIN_REVISION: ${{ inputs.plugin_revision }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from importlib.metadata import version
          from pathlib import Path
          path = Path("publicsite/screenshots/build.json")
          data = json.loads(path.read_text())
          data["plugin_capture_revisions"] = {
              "abx-plugins": os.environ["PLUGIN_REVISION"],
              **{package: version(package) for package in ("abx-dl", "abxpkg", "abxbus")},
          }
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Verify gallery was generated from this exact revision
        if: inputs.plugin_revision != ''
        run: |
          uv run --no-cache --no-sync python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          provenance = json.loads(Path("publicsite/screenshots/build.json").read_text())
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert provenance["revision"] == os.environ["GITHUB_SHA"], provenance
          assert provenance["version"] == version, provenance
          assert provenance["capture_count"] >= 3 * 35, provenance
          assert len(provenance["files"]) == provenance["capture_count"], provenance
          required = {
              f"{view}-{profile}.png"
              for view in ("navigation-tools-menu", "first-time-setup-wizard")
              for profile in ("desktop", "tablet", "mobile")
          }
          missing = required.difference(provenance["files"])
          assert not missing, f"Missing required gallery images: {sorted(missing)}"
          assert all(not re.match(r"^\d+-", name) for name in provenance["files"]), provenance
          PY

      - name: Save validated screenshots
        if: inputs.plugin_revision != ''
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: publicsite/screenshots
          if-no-files-found: error
          retention-days: 90

      - name: Record failed capture resource diagnostics
        if: failure()
        run: |
          # Resource evidence only: never collect environment variables,
          # process arguments, browser profiles, or provider persona contents.
          umask 077
          diagnostics="$RUNNER_TEMP/gallery-failure-diagnostics"
          mkdir -p "$diagnostics"
          {
            echo 'Memory totals (kB)'
            if [[ -r /proc/meminfo ]]; then
              awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/' /proc/meminfo
            else
              echo 'Memory totals unavailable'
            fi
            echo 'Cgroup memory'
            cgroup_path=''
            if [[ -r /proc/self/cgroup ]]; then
              cgroup_path="$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)"
            fi
            cgroup_path="${cgroup_path%/}"
            for cgroup_dir in "/sys/fs/cgroup$cgroup_path" /sys/fs/cgroup; do
              for metric in memory.max memory.peak memory.events memory.swap.max memory.swap.peak; do
                if [[ -r "$cgroup_dir/$metric" ]]; then
                  printf '%s: ' "$cgroup_dir/$metric"
                  head -c 4096 "$cgroup_dir/$metric"
                  echo
                fi
              done
              [[ "$cgroup_dir" != /sys/fs/cgroup ]] || break
            done
            echo 'Kernel memory/process failures (last 50 matching lines)'
            if ! sudo -n dmesg --color=never 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process|segfault' | tail -50 | tail -c 16384; then
              echo 'No matching kernel failures, or kernel log unavailable'
            fi
          } > "$diagnostics/system-memory.log"

      - name: Retain failed gallery frame and request diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-failure-diagnostics
          path: ${{ runner.temp }}/gallery-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove provider persona and browser profiles
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/provider-auth.json"
          rm -rf "$RUNNER_TEMP/provider-gallery-data"

  assemble:
    needs: [deploy, public_recipes]
    if: inputs.plugin_revision == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install exact generator package dependencies
        run: uv sync --no-cache --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gallery-capture-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/gallery-captures
      - name: Assemble and render the complete gallery
        run: |
          uv run --no-sync python bin/assemble_screenshot_gallery.py merge \
            "$RUNNER_TEMP/gallery-captures" "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/gallery.jsonl"
          # The unchanged renderer enforces every required base/plugin view;
          # do not allow incomplete standalone bundles to reach Pages.
          mkdir -p publicsite/screenshots
          cp "$RUNNER_TEMP/screenshots/"*.png publicsite/screenshots/
          env -u UI_SCREENSHOT_ALLOW_PARTIAL -u UI_SCREENSHOT_PLUGINS uv run --no-sync python bin/generate_ui_screenshot_gallery.py build \
            "$RUNNER_TEMP/gallery.jsonl" "$RUNNER_TEMP/Screenshots.md" publicsite/screenshots/index.html

      - name: Verify gallery was generated from this exact revision
        run: |
          uv run --no-cache --no-sync python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          provenance = json.loads(Path("publicsite/screenshots/build.json").read_text())
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert provenance["revision"] == os.environ["GITHUB_SHA"], provenance
          assert provenance["version"] == version, provenance
          assert provenance["capture_count"] >= 3 * 35, provenance
          assert len(provenance["files"]) == provenance["capture_count"], provenance
          required = {
              f"{view}-{profile}.png"
              for view in ("navigation-tools-menu", "first-time-setup-wizard")
              for profile in ("desktop", "tablet", "mobile")
          }
          missing = required.difference(provenance["files"])
          assert not missing, f"Missing required gallery images: {sorted(missing)}"
          assert all(not re.match(r"^\d+-", name) for name in provenance["files"]), provenance
          PY

      - name: Save validated screenshots
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: publicsite/screenshots
          if-no-files-found: error
          retention-days: 90

  complete:
    name: 'Scheduled inputs: ${{ needs.changes.outputs.key }}'
    needs: [changes, assemble]
    if: needs.changes.outputs.changed == 'true' && inputs.plugin_revision == ''
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled work completed successfully.'
