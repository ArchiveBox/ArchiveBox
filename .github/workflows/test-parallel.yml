name: Parallel Tests

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: Run one discovered test file
        required: true
        default: archivebox/tests/test_cli_list.py
        type: string
  workflow_call:
    inputs:
      test_file:
        description: Run one discovered test file; empty runs the complete matrix
        required: false
        default: ""
        type: string

env:
  PYTHONIOENCODING: utf-8
  PYTHONLEGACYWINDOWSSTDIO: utf-8
  USE_COLOR: False
  UV_NO_SOURCES: "1"
  CI_PYTHON_VERSION: "3.13"
  CHROME_VENDOR_VERSION: "157.0.8103.38"
  CHROME_VENDOR_GENERATION: "1793667047341974"
  CHROME_VENDOR_SHA256: "8cdeb344e9b2cefe59f4aea8d1d93d5d93054c03cde217665c16fc1f62e72a66"

jobs:
  discover-tests:
    name: Discover every test
    # Selection must run on GitHub so an offline NAS cannot block the fallback.
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.discover.outputs.tests }}
      runner: ${{ steps.runner.outputs.use-runner || '["ubuntu-24.04"]' }}

    steps:
      - name: Select available CI capacity
        id: runner
        if: vars.UGNAS_CI_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: ArchiveBox/monorepo/.github/actions/select-ci-runner@main
        with:
          github-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.5"
          enable-cache: false
          cache-dependency-glob: uv.lock

      - name: Resolve discovery tools through abxpkg
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/abx-lib
        run: |
          set -Eeuo pipefail
          ABXPKG_SPEC="$(uv run --no-cache --no-project python -c 'import tomllib; package = next(item for item in tomllib.load(open("uv.lock", "rb"))["package"] if item["name"] == "abxpkg"); wheel = package["wheels"][0]; print("abxpkg @ {}#{}".format(wheel["url"], wheel["hash"].replace(":", "=")))')"
          test -n "$ABXPKG_SPEC"
          mkdir -p "$ABXPKG_LIB_DIR/env/bin"
          export PYTHON_BINARY="$pythonLocation/bin/python"
          test -x "$PYTHON_BINARY"
          uv run --no-cache --no-project --with "$ABXPKG_SPEC" abxpkg env \
            --install \
            --lib="$ABXPKG_LIB_DIR" \
            --deps-from="$GITHUB_WORKSPACE/.github/configs/ci-tooling.json:ci_binaries"
          {
            echo "PYTHON_BINARY=$ABXPKG_LIB_DIR/env/bin/python"
            echo "JQ_BINARY=$ABXPKG_LIB_DIR/env/bin/jq"
          } >> "$GITHUB_ENV"
          test -L "$ABXPKG_LIB_DIR/env/bin/python"
          test -x "$ABXPKG_LIB_DIR/env/bin/python"
          test -L "$ABXPKG_LIB_DIR/env/bin/jq"
          test -x "$ABXPKG_LIB_DIR/env/bin/jq"

      - name: Discover every test exactly once
        id: discover
        env:
          TEST_FILE: ${{ inputs.test_file }}
          UGNAS_CI_MAX_JOBS: ${{ vars.UGNAS_CI_MAX_JOBS || 3 }}
        run: |
          set -Eeuo pipefail
          mapfile -t output < <("$PYTHON_BINARY" .github/scripts/discover_test_matrix.py)
          test "${#output[@]}" -eq 2
          if [[ -n "$TEST_FILE" ]]; then
            output[1]="$("$JQ_BINARY" -ce '[.[] | select(.paths == [env.TEST_FILE])] | select(length == 1)' <<< "${output[1]}")"
          fi
          echo "${output[0]}"
          "$JQ_BINARY" -e 'length > 0 and length <= 256 and ([.[].paths[]] | length == (unique | length))' <<< "${output[1]}"
          echo "tests=$("$JQ_BINARY" -c '[.[] | select(.environment == "")]' <<< "${output[1]}")" >> "$GITHUB_OUTPUT"
          # Cookie-dependent entries run in provider-replay.yml, outside release CI.
          "$JQ_BINARY" -e '[.[] | select(.environment == "")] | length > 0' <<< "${output[1]}"

  chrome-vendor-cache:
    name: Populate the verified Chrome vendor cache
    if: >-
      github.repository == 'ArchiveBox/ArchiveBox' && (github.ref_name == 'dev' || github.ref_name == 'main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: chrome-vendor-cache-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the existing vendor cache
        id: chrome-archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          lookup-only: true
          path: ${{ runner.temp }}/chrome-vendor-archive
          key: chrome-vendor-v1-linux-x64-${{ env.CHROME_VENDOR_VERSION }}-${{ env.CHROME_VENDOR_SHA256 }}

      - name: Set up Squid for the vendor download
        if: steps.chrome-archive.outputs.cache-hit != 'true'
        uses: ArchiveBox/monorepo/.github/actions/setup-squid@a877c13fc6db20e06f87aaef34502ab3c7f57e41
        with:
          proxy: ${{ vars.SQUID_TAILNET_URL }}
          ca: ${{ vars.SQUID_CA }}
          tailscale-client-id: ${{ vars[github.ref_name == 'dev' && 'SQUID_TAILSCALE_CLIENT_ID_DEV' || 'SQUID_TAILSCALE_CLIENT_ID'] }}
          tailscale-audience: ${{ vars[github.ref_name == 'dev' && 'SQUID_TAILSCALE_AUDIENCE_DEV' || 'SQUID_TAILSCALE_AUDIENCE'] }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.chrome-archive.outputs.cache-hit != 'true'
      - name: Download and verify the exact vendor archive
        if: steps.chrome-archive.outputs.cache-hit != 'true'
        run: bash .github/ci_stage_chrome_vendor_archive.sh download

      - name: Save verified Chrome vendor archive
        if: steps.chrome-archive.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/chrome-vendor-archive
          key: ${{ steps.chrome-archive.outputs.cache-primary-key }}

  tests:
    permissions:
      actions: read
      contents: read
      id-token: write
    name: ${{ matrix.test.name }}
    needs: discover-tests
    if: needs.discover-tests.outputs.tests != '[]'
    # Opt in trusted branches only; PRs always use GitHub-hosted runners.
    # Ordinary Linux tests are eligible; # ci-runner: hosted declares exceptions.
    # The hosted discovery job falls back when workers are offline or the
    # availability API fails. UGNAS_CI_ENABLED=false disables the pool entirely.
    runs-on: ${{ fromJSON(matrix.test.ugnas && needs.discover-tests.outputs.runner || '["ubuntu-24.04"]') }}
    env:
      CHROME_HEADLESS: "true"

    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.discover-tests.outputs.tests) }}

    steps:
      - name: Spread hosted proxy setup
        if: >-
          runner.environment == 'github-hosted' &&
          github.repository == 'ArchiveBox/ArchiveBox' && (github.ref_name == 'dev' || github.ref_name == 'main') &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          CI_JOB_INDEX: ${{ strategy.job-index }}
        run: |
          # Spread simultaneous hosted connections to the shared proxy without throttling NAS jobs.
          sleep "$(( (CI_JOB_INDEX % 12) * 2 ))"

      - name: Set up Squid
        if: >-
          github.repository == 'ArchiveBox/ArchiveBox' && (github.ref_name == 'dev' || github.ref_name == 'main') &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ArchiveBox/monorepo/.github/actions/setup-squid@a877c13fc6db20e06f87aaef34502ab3c7f57e41
        with:
          proxy: ${{ vars[runner.environment == 'self-hosted' && 'SQUID_LAN_URL' || 'SQUID_TAILNET_URL'] }}
          ca: ${{ vars.SQUID_CA }}
          tailscale-client-id: ${{ vars[github.ref_name == 'dev' && 'SQUID_TAILSCALE_CLIENT_ID_DEV' || 'SQUID_TAILSCALE_CLIENT_ID'] }}
          tailscale-audience: ${{ vars[github.ref_name == 'dev' && 'SQUID_TAILSCALE_AUDIENCE_DEV' || 'SQUID_TAILSCALE_AUDIENCE'] }}
          browser: 'true'

      - name: Set job-local runtime paths
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_TEST_MAX_WORKERS: ${{ matrix.test.max_workers }}
        run: |
          workers=2
          if [[ "$CI_RUNNER_ENVIRONMENT" == github-hosted ]]; then
            workers="$(nproc)"
          fi
          if (( CI_TEST_MAX_WORKERS > 0 && workers > CI_TEST_MAX_WORKERS )); then
            workers="$CI_TEST_MAX_WORKERS"
          fi
          {
            echo "CI_TEST_WORKERS=$workers"
            echo "ABXPKG_LIB_DIR=$RUNNER_TEMP/archivebox-lib"
            echo "DATA_DIR=$RUNNER_TEMP/archivebox-test-data"
            echo "PERSONAS_DIR=$RUNNER_TEMP/abx-personas"
            echo "CHROME_USER_DATA_DIR=$RUNNER_TEMP/abx-personas/Default/chrome_profile"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Use the standard Ubuntu archive on hosted Linux
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          # Prefer the public archive over the remaining cloud-local mirror.
          # The Azure mirror can trickle bytes indefinitely without triggering
          # APT's stall timeout: https://github.com/actions/runner-images/issues/14823
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -Ei '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]+priority:1$|d' /etc/apt/apt-mirrors.txt
            sudo sed -Ei 's|^(https://archive\.ubuntu\.com/ubuntu/[[:space:]]+)priority:2$|\1priority:0|' /etc/apt/apt-mirrors.txt
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          architecture: x64
        id: python

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.5"
          enable-cache: false
          cache-dependency-glob: uv.lock

      # Self-hosted tool storage survives jobs. Normal abxpkg validation and
      # install locks allow reuse across files; cold-install tests use tmp_path.
      - name: Reuse persistent runner tools
        if: runner.environment == 'self-hosted'
        env:
          PERSISTENT_ABXPKG_LIB: ${{ runner.tool_cache }}/abxpkg/${{ github.repository }}/${{ steps.python.outputs.python-version }}
        run: |
          mkdir -p "$PERSISTENT_ABXPKG_LIB"
          echo "ABXPKG_LIB_DIR=$PERSISTENT_ABXPKG_LIB" >> "$GITHUB_ENV"

      # Restored binaries still pass normal abxpkg resolution/version checks.
      # Installation and isolation tests explicitly choose fresh temporary libs.
      - name: Identify runtime dependency cache
        shell: bash
        run: |
          uv run --no-project python - <<'PYTHON' >> "$GITHUB_ENV"
          import hashlib
          import json
          import tomllib
          from pathlib import Path

          packages = tomllib.loads(Path("uv.lock").read_text())["package"]
          versions = {p["name"]: p["version"] for p in packages if p["name"] in {"abxpkg", "abx-plugins"} and "editable" not in p["source"]}
          print("ABXPKG_CACHE_DEPS=" + hashlib.sha256(json.dumps(versions, sort_keys=True).encode()).hexdigest())
          PYTHON

      - name: Reuse validated runtime dependencies
        if: runner.environment != 'self-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/archivebox-lib
          # Managed venvs link to setup-python's patch-specific interpreter path.
          # A 3.13.15 cache cannot run on a host that only has 3.13.16 installed.
          key: abxpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ steps.python.outputs.python-version }}-${{ matrix.test.name }}-${{ env.ABXPKG_CACHE_DEPS }}
          restore-keys: |
            abxpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ steps.python.outputs.python-version }}-${{ matrix.test.name }}-

      - name: Resolve optional build dependencies through abxpkg
        if: matrix.test.extra != '' || contains(matrix.test.paths_arg, 'test_postgres_backend')
        env:
          TEST_EXTRA: ${{ matrix.test.extra }}
          TEST_PATHS: ${{ matrix.test.paths_arg }}
        run: |
          set -Eeuo pipefail
          ABXPKG_SPEC="$(uv run --no-cache --no-project python -c 'import tomllib; package = next(item for item in tomllib.load(open("uv.lock", "rb"))["package"] if item["name"] == "abxpkg"); wheel = package["wheels"][0]; print("abxpkg @ {}#{}".format(wheel["url"], wheel["hash"].replace(":", "=")))')"
          test -n "$ABXPKG_SPEC"
          dependency_sources=()
          if [[ -n "$TEST_EXTRA" ]]; then
            dependency_sources+=(--deps-from="$GITHUB_WORKSPACE/.github/configs/ci-linux-build.json:required_binaries")
          fi
          if [[ "$TEST_PATHS" == *test_postgres_backend* ]]; then
            dependency_sources+=(--deps-from="$GITHUB_WORKSPACE/.github/configs/ci-linux-build.json:postgres_binaries")
          fi
          uv run --no-cache --no-project --with "$ABXPKG_SPEC" abxpkg env \
            --install \
            --no-cache \
            --json \
            --lib="$ABXPKG_LIB_DIR" \
            "${dependency_sources[@]}"

      # Restore locked wheels across nearby releases so the hosted matrix does
      # not request the same packages from the CI proxy in every shard.
      - name: Cache Python wheels
        id: uv-cache
        if: >-
          runner.environment == 'github-hosted' &&
          github.repository == 'ArchiveBox/ArchiveBox' && (github.ref_name == 'dev' || github.ref_name == 'main') &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-sync-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-sync-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-

      - name: Install test dependencies
        env:
          TEST_EXTRA: ${{ matrix.test.extra }}
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_NO_CACHE: ${{ steps.uv-cache.outcome == 'success' && '0' || '1' }}
        run: |
          set -Eeuo pipefail
          extra_args=()
          if [[ -n "$TEST_EXTRA" ]]; then
            extra_args=(--extra "$TEST_EXTRA")
          fi
          uv sync --locked --dev "${extra_args[@]}"
      # These hosted Chrome lanes repeatedly timed out acquiring this 7.5 MB
      # Noble universe package. Populate only APT's download cache: the native
      # Puppeteer dependency installer still resolves and installs the fonts.
      - name: Restore verified Noble font archive
        if: >-
          runner.os == 'Linux' && runner.arch == 'X64' && runner.environment == 'github-hosted' &&
          (contains(matrix.test.paths, 'archivebox/tests/test_plugin_config_widgets.py') ||
           contains(matrix.test.paths, 'archivebox/tests/test_plugin_recovery.py') ||
           contains(matrix.test.paths, 'archivebox/tests/test_snapshot_viewport_preview.py') ||
           contains(matrix.test.paths, 'archivebox/tests/test_ui_live_progress.py'))
        id: noble-font-archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/noble-font-archive
          key: noble-font-v1-0.9.45-8-496969d65dc5664a3291e678d5cbef6815dc308ee5bf37b656c00af2cb490410

      - name: Verify and stage Noble font archive for APT
        if: steps.noble-font-archive.outcome == 'success'
        id: stage-noble-font
        shell: bash
        run: bash .github/ci_stage_noble_font.sh

      - name: Save verified Noble font archive
        if: >-
          steps.stage-noble-font.outputs.verified == 'true' && steps.noble-font-archive.outputs.cache-hit != 'true' &&
          contains(matrix.test.paths, 'archivebox/tests/test_ui_live_progress.py')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/noble-font-archive
          key: ${{ steps.noble-font-archive.outputs.cache-primary-key }}

      - name: Check whether this batch needs its pinned Chrome ZIP
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'X64'
        id: chrome-vendor-needed
        env:
          TEST_PATHS: ${{ matrix.test.paths_arg }}
        run: |
          read -r -a test_paths <<< "$TEST_PATHS"
          needed="$(uv run --no-sync --no-sources python .github/scripts/needs_chrome_vendor_archive.py "$CHROME_VENDOR_VERSION" "${test_paths[@]}")"
          if [[ "$needed" == true ]]; then
            bash .github/ci_stage_chrome_vendor_archive.sh check
          fi

      - name: Restore exact Chrome vendor archive
        if: steps.chrome-vendor-needed.outputs.needed == 'true'
        id: chrome-archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/chrome-vendor-archive
          key: chrome-vendor-v1-linux-x64-${{ env.CHROME_VENDOR_VERSION }}-${{ env.CHROME_VENDOR_SHA256 }}

      - name: Wait briefly for the shared Chrome vendor cache
        if: >-
          steps.chrome-vendor-needed.outputs.needed == 'true' && steps.chrome-archive.outputs.cache-hit != 'true' &&
          github.repository == 'ArchiveBox/ArchiveBox' && (github.ref_name == 'dev' || github.ref_name == 'main') &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: chrome-cache-wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="chrome-vendor-v1-linux-x64-$CHROME_VENDOR_VERSION-$CHROME_VENDOR_SHA256"
          sleep "$(( RANDOM % 10 ))"
          for _ in {1..6}; do
            count="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$key" -f ref="$GITHUB_REF" --jq '.total_count')" || break
            if [[ "$count" != 0 ]]; then
              echo 'available=true' >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 10
          done

      - name: Restore newly populated Chrome vendor archive
        if: steps.chrome-cache-wait.outputs.available == 'true'
        id: cold-chrome-archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/chrome-vendor-archive
          key: ${{ steps.chrome-archive.outputs.cache-primary-key }}

      - name: Verify and stage exact Chrome vendor archive
        if: steps.chrome-archive.outputs.cache-hit == 'true' || steps.cold-chrome-archive.outputs.cache-hit == 'true'
        run: bash .github/ci_stage_chrome_vendor_archive.sh stage

      - name: Run ${{ matrix.test.name }}
        env:
          TEST_PATHS: ${{ matrix.test.paths_arg }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          ABX_CI_STAGE_NOBLE_FONT: ${{ runner.os == 'Linux' && runner.arch == 'X64' && runner.environment == 'github-hosted' }}
        run: |
          set -Eeuo pipefail
          echo "Running pytest with $CI_TEST_WORKERS workers on $CI_RUNNER_ENVIRONMENT"
          read -r -a test_paths <<< "$TEST_PATHS"
          test_args=()
          for test_path in "${test_paths[@]}"; do
            test -f "$test_path"
            test_args+=("$GITHUB_WORKSPACE/$test_path")
          done
          # Each test still gets isolated DB/filesystem state from conftest.
          # Keep one worker pool per batch instead of starting it for every file.
          mkdir -p "$DATA_DIR" "$PERSONAS_DIR" "$RUNNER_TEMP/pytest"
          uv run --no-cache --no-sync --no-sources pytest -vs -n "$CI_TEST_WORKERS" "${test_args[@]}" --durations=20 -o faulthandler_timeout=60 \
            --basetemp="$RUNNER_TEMP/pytest" \
            --junitxml="$RUNNER_TEMP/test-results/results.xml"
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-results/*.xml
          if-no-files-found: error
          retention-days: 14
      - name: Collect failed runtime diagnostics
        if: failure()
        run: |
          uv run --no-project python - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          roots = {
              "pytest": temp / "pytest",
              "npm": Path.home() / ".npm/_logs",
              "managed-npm": Path(os.environ["ABXPKG_LIB_DIR"]) / "cache/npm/_logs",
          }
          def report_error(error):
              raise error

          for label, root in roots.items():
              if not root.is_dir():
                  continue
              # Snapshot failure tests create broken/cyclic symlinks. Never
              # follow them while preserving the original failure's logs.
              for directory, _, filenames in os.walk(root, followlinks=False, onerror=report_error):
                  for filename in filenames:
                      source = Path(directory) / filename
                      if source.suffix != ".log" or source.is_symlink() or not source.is_file():
                          continue
                      target = temp / "runtime-logs" / label / source.relative_to(root)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, target)
          PYTHON
      - name: Save failed runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-logs-${{ strategy.job-index }}
          # OpenCode's pnpm postinstall invokes npm; retain its download-stage
          # logs when the outer installer times out without emitting output.
          # Managed pnpm bootstrap uses a separate npm cache. Without its logs,
          # later ENOTEMPTY errors hide the initial installation stall.
          path: ${{ runner.temp }}/runtime-logs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
