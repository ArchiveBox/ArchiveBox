{% with insight=snapshot.ai_enrichment %}{% if insight.status == 'succeeded' and insight.summary %}<details class="snapshot-ai-summary" style="margin:18px 0;padding:20px 24px;border:1px solid var(--hairline-color, #e5e7eb);border-radius:12px;background:var(--body-bg, #fff);color:var(--body-fg, #222);font-size:14px"><summary style="cursor:pointer;color:#aa1e55;font-size:14px;font-weight:600">✦ AI summary</summary><p style="margin:12px 0 0;line-height:1.7">{{ insight.summary|linebreaksbr }}</p>{% if insight.tags %}<p style="margin:12px 0 0;font-size:12px;color:var(--body-quiet-color, #666)">{{ insight.tags|join:" · " }}</p>{% endif %}</details>{% endif %}{% endwith %}
