{% load admin_list %}
<div class="importer-history-heading">
  <h2>Run history</h2>
  <div class="actions">
    <a href="{% url 'importers:export-runs' source_id 'csv' %}">History CSV</a>
    <a href="{% url 'importers:export-runs' source_id 'jsonl' %}">History JSONL</a>
  </div>
</div>
{% if cl.result_count %}
  <div class="module importer-history" aria-label="Run history">
    {% with opts=cl.opts %}{% result_list cl %}{% pagination cl %}{% endwith %}
  </div>
{% else %}<p class="muted">No runs yet.</p>{% endif %}
