<style>
.importers:has(.run-page){max-width:none;font:13px/1.5 var(--font-family-primary,system-ui,sans-serif)}
.run-page a:not(.button):not([role=menuitem]){color:var(--link-fg,#417690);font:inherit;text-decoration:none!important}
.run-page a:not(.button):not([role=menuitem]):hover{text-decoration:underline!important}
.importers .run-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.importers .run-heading h1{font-size:18px;line-height:28px;letter-spacing:0;margin:0;font-weight:600}
.run-heading h1>span{color:var(--body-quiet-color,#667085);margin:0 6px;font-weight:400}
.importers .run-page [data-activity-url]{margin:0}
.run-activity{padding:10px 12px;background:var(--body-bg,#fff);border:1px solid var(--hairline-color,#dce3eb);border-radius:4px;margin-bottom:12px}
.run-summary{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-height:32px}
.run-message{font-size:13px;overflow-wrap:anywhere}
.importers .run-actions{display:flex;flex-wrap:wrap;align-items:center;margin-left:auto;width:auto;gap:12px}
.importers .run-page .button{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:5px 10px;border-radius:4px;font:inherit;line-height:20px;white-space:nowrap}
.run-metadata{margin-top:6px;color:var(--body-quiet-color,#64748b)}
.importers .run-logs summary{font-size:12px;font-weight:400;line-height:24px}
.run-metadata dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 20px;padding:4px 0;margin:0;font-size:12px}
.run-metadata dt{font-size:11px;margin:0 0 2px}.run-metadata dd{color:var(--body-fg,#182534)}
.run-metadata code{font-size:11px}.run-error{color:var(--error-fg,#ba2121)}
.run-page [data-activity-status]{font-size:12px;margin:8px 0}
@media(max-width:600px){
 .importers .run-heading{align-items:flex-start;gap:8px}.importers .run-heading h1{font-size:16px;line-height:24px}
 .run-summary{gap:6px 8px}.importers .run-actions{margin-left:0;flex-basis:100%;justify-content:flex-end}
 .run-activity{padding:8px}
 .run-metadata dl{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
 .run-metadata dl>div:first-child{grid-column:1/-1}
}
</style>
