{% load static %}
<div id="progress-monitor" class="{% if not progress_auto_expand %}collapsed{% endif %}"
     data-progress-endpoint="{{ progress_endpoint|default:'/progress.json' }}"
     data-progress-scope="{{ progress_scope|default:'global' }}"
     data-auto-expand="{% if progress_auto_expand %}1{% else %}0{% endif %}">
    <div class="header-bar">
        <div class="metric-strip">
            <div class="orchestrator-status metric-badge" id="metric-status" tabindex="0">
                <svg class="status-icon" id="orchestrator-dot" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>
                <span id="orchestrator-text">Loading status…</span>
            </div>
            <div class="telemetry" id="progress-telemetry" aria-label="Capture and server metrics" hidden>
                <span class="metric-badge" id="metric-throughput" tabindex="0" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 6-6 4 4 8-10M15 5h6v6"/></svg><span class="metric-text">URLs/hr —</span></span>
                <span class="metric-badge" id="metric-resources" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3m6-3v3M9 18v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"/></svg><span class="metric-text">— · RAM —</span></span>
                <span class="metric-badge" id="metric-io" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20V4m-4 4 4-4 4 4m6-4v16m-4-4 4 4 4-4"/></svg><span class="metric-text">I/O —</span></span>
                <span class="metric-badge" id="metric-storage" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><span class="metric-text">—</span></span>
                <span class="metric-badge" id="metric-web" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span class="metric-text">—ms</span></span>
            </div>
            <span class="metric-badge" id="metric-indexing" tabindex="0" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1m-1 6h1m-1 6h1"/></svg><span class="metric-text">Indexing —</span></span>
        </div>
        <div class="header-right">
            <button class="toggle-btn" id="progress-collapse" title="Toggle details" aria-expanded="{% if progress_auto_expand %}true{% else %}false{% endif %}">
                {% if progress_auto_expand %}Hide{% else %}Details{% endif %}
            </button>
        </div>
    </div>

    <div class="progress-content">
        <div class="tree-container" id="tree-container">
            <div class="idle-message" id="idle-message">Loading crawl progress…</div>
            <div id="crawl-tree"></div>
        </div>
        <aside class="screencast-panel" id="screencast-panel" aria-label="Live browser screencast"></aside>
    </div>
</div>

<script>
    // Restore the chosen height before painting the table. Polling and tree
    // controls can load independently from the versioned script.
    (() => {
        const monitor = document.getElementById('progress-monitor');
        let saved;
        try { saved = localStorage.getItem('progress-monitor-collapsed'); } catch (e) {}
        if (saved == null || monitor.classList.contains('collapsed') === (saved === 'true')) return;
        const collapsed = saved === 'true';
        monitor.classList.toggle('collapsed', collapsed);
        const button = monitor.querySelector('#progress-collapse');
        button.textContent = collapsed ? 'Details' : 'Hide';
        button.setAttribute('aria-expanded', String(!collapsed));
    })();
</script>
<script defer src="{% static 'progress-monitor.js' %}"></script>
