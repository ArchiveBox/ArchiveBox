<div class="field">
  {% if field.field.widget.input_type == "checkbox" %}
    <label for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
  {% else %}
    {{ field.label_tag }}{{ field }}
  {% endif %}
  {{ field.errors }}{% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
</div>
