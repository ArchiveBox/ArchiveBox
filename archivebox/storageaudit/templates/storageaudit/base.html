{% extends "admin/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block extrastyle %}{{ block.super }}<style>
.storage-audit{--audit-accent:var(--archivebox-accent,#a51c50);width:100%;min-width:0;margin:0;color:var(--body-fg);font-size:13px}
.storage-audit *{box-sizing:border-box}.storage-audit h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.storage-audit h2{font-size:14px;font-weight:600;margin:0;padding:8px 10px;background:var(--darkened-bg);border-bottom:1px solid var(--hairline-color)}
.audit-toolbar,.audit-totals{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin:0 0 12px}.audit-toolbar form{margin:0}.audit-toolbar .audit-totals{margin:0;margin-left:auto}
#content .storage-audit form.audit-toolbar>.audit-totals{width:auto;gap:8px 16px;margin-left:auto}.audit-totals{font-variant-numeric:tabular-nums}.audit-totals span{white-space:nowrap}.audit-totals strong{font-weight:600}.storage-audit .muted{color:var(--body-quiet-color);font-size:12px}
.storage-audit button,.storage-audit .button{display:inline-block;background:var(--audit-accent);color:white;border:1px solid var(--audit-accent);border-radius:4px;padding:5px 10px;line-height:20px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}.storage-audit button:disabled{opacity:.45;cursor:not-allowed}
.storage-audit input[type=search]{padding:5px 9px;border:1px solid var(--border-color);border-radius:4px;min-width:220px;font-size:13px;line-height:20px}
.audit-rankings{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:16px;margin-bottom:16px}.audit-section{margin:0 0 16px;min-width:0;border:1px solid var(--hairline-color);background:var(--body-bg)}.audit-rankings .audit-section{margin:0}
.audit-scroll{overflow-x:auto;max-width:100%}.storage-audit table{width:100%;border-collapse:collapse;font-size:13px}.storage-audit th,.storage-audit td{padding:6px 10px;border-bottom:1px solid var(--hairline-color);text-align:left;vertical-align:top;line-height:20px}.storage-audit th{font-size:11px;letter-spacing:.02em;white-space:nowrap;color:var(--body-quiet-color);background:var(--darkened-bg)}.storage-audit tbody tr:last-child>td{border-bottom:0}.storage-audit tbody tr:hover{background:var(--selected-row)}.storage-audit .number{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.storage-audit .audit-title{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.storage-audit .audit-rankings td:first-child{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.storage-audit a{overflow-wrap:anywhere}.storage-audit code{font-size:12px;overflow-wrap:anywhere}.storage-audit summary{cursor:pointer;font-weight:500}.storage-audit details>summary{padding:6px 10px}.audit-extension{border-bottom:1px solid var(--hairline-color)}.audit-extension:last-child{border-bottom:0}.audit-extension summary{display:list-item;list-style-position:inside}.audit-extension summary .audit-extension-label{display:inline-grid;grid-template-columns:90px 1fr 100px;gap:16px;width:calc(100% - 24px);vertical-align:middle}.audit-extension-label>strong:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.audit-extension summary strong:last-child{text-align:right;font-variant-numeric:tabular-nums}.audit-extension[open]>summary{background:var(--darkened-bg)}.audit-extension .audit-scroll{max-height:320px}.audit-extension .audit-toolbar{margin:8px 10px}.audit-files{table-layout:fixed;min-width:650px}.audit-files .audit-path{width:42%;overflow-wrap:anywhere}.audit-files .audit-capture{width:36%}.audit-files .audit-size{width:12%}.audit-files .audit-select{width:10%}.audit-files td{font-size:12px}.audit-files .audit-capture a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.audit-files time{white-space:nowrap}.storage-audit input[type=checkbox]{margin:0;vertical-align:middle}
.audit-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:8px 10px;font-size:12px}.audit-meta form{margin:0}.audit-status{font-variant-numeric:tabular-nums}.audit-notice{padding:8px 10px;background:var(--darkened-bg);border-left:3px solid var(--audit-accent);margin:8px 0;font-size:13px}.storage-audit pre{white-space:pre-wrap;overflow-wrap:anywhere}.audit-actions{padding:8px 10px}.storage-audit .empty{color:var(--body-quiet-color)}
@media(max-width:1000px){.audit-rankings{grid-template-columns:1fr}.storage-audit .audit-rankings td:first-child{max-width:none}.audit-toolbar .audit-totals{margin-left:0}}
@media(max-width:600px){#content{padding:12px}.storage-audit input[type=search]{min-width:0;width:180px}.audit-extension summary .audit-extension-label{grid-template-columns:60px 1fr 80px;gap:6px}.audit-totals{gap:6px 12px}.storage-audit th,.storage-audit td{padding:5px 8px}}
</style>{% endblock %}
{% block breadcrumbs %}<div class="breadcrumbs"><a href="/admin/">Home</a> &rsaquo; <a href="{% url 'storageaudit:index' %}">Storage audit</a></div>{% endblock %}
{% block content %}<main class="storage-audit">{% block audit_content %}{% endblock %}</main>{% endblock %}
