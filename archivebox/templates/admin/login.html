{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
<script>
  // Redirect to allauth login, preserving the ?next= parameter
  var next = "{{ next|default:"/admin/"|escapejs }}";
  window.location.replace("/accounts/login/?next=" + encodeURIComponent(next));
</script>
<noscript>
  <p><a href="/accounts/login/?next={{ next|default:'/admin/'|urlencode }}">Click here to log in</a></p>
</noscript>
{% endblock %}
