{% if opts.app_label == "core" and opts.model_name == "snapshot" and not embedded_changelist %}
<script>
  (function() {
    if (window.archiveboxSnapshotSearchStreamReady) return;
    window.archiveboxSnapshotSearchStreamReady = true;
    {% include "includes/search_stream.js" %}
    var activeSearch = null;

    function setSearchLoading(controller) {
      if (activeSearch !== controller) return;
      var form = document.querySelector('form#changelist-search');
      if (!form) return;
      var toolbar = form.closest('#toolbar');
      if (!toolbar) return;
      var status = toolbar.parentElement.querySelector('.archivebox-search-stream-status');
      if (!status) {
        status = document.createElement('span');
        status.className = 'archivebox-search-stream-status';
        status.setAttribute('role', 'status');
        status.setAttribute('aria-live', 'polite');
        toolbar.after(status);
      }
      controller.progress.show(status);
      form.setAttribute('aria-busy', 'true');
    }

    function clearSearchLoading(controller) {
      if (activeSearch && activeSearch !== controller) return;
      var form = document.querySelector('form#changelist-search');
      if (!form) return;
      var toolbar = form.closest('#toolbar');
      if (!toolbar) return;
      var status = toolbar.parentElement.querySelector('.archivebox-search-stream-status');
      if (status) status.hidden = true;
      form.removeAttribute('aria-busy');
    }

    function cancelActiveSearch(event) {
      if (!event.target || (event.target.name !== "q" && event.target.name !== "search_mode")) return;
      if (activeSearch) {
        var controller = activeSearch;
        activeSearch.abort();
        clearSearchLoading(controller);
        var message = document.querySelector(".search-empty-state [data-search-pending]");
        if (message) {
          message.removeAttribute("data-search-pending");
          message.textContent = "Search canceled. Press Enter to search again.";
        }
      }
    }

    function setChangelistSearchingState(controller) {
      if (activeSearch !== controller) return;
      var changelist = document.getElementById("changelist");
      if (!changelist) return;

      var results = changelist.querySelector(".results, .cards");
      if (!results) {
        results = document.createElement("div");
        var toolbar = changelist.querySelector("#toolbar");
        if (toolbar && toolbar.nextSibling) {
          toolbar.parentNode.insertBefore(results, toolbar.nextSibling);
        } else {
          changelist.appendChild(results);
        }
      }
      results.className = "results search-empty-state";
      while (results.firstChild) results.removeChild(results.firstChild);
      var message = document.createElement("p");
      message.setAttribute("data-search-pending", "");
      message.textContent = "Searching matching snapshots...";
      results.appendChild(message);

      // These controls describe the old membership (and its selection).
      // The first result fragment restores the normal controls for this query.
      changelist.querySelectorAll(".paginator, .actions, .action-summary").forEach(node => node.remove());
      return message;
    }

    function streamSnapshotSearch(eventOrForm) {
      var form = eventOrForm && eventOrForm.target ? eventOrForm.target : eventOrForm;
      if (!form || form.id !== "changelist-search") return;

      var formData = new FormData(form);
      var mode = String(formData.get("search_mode") || "query");
      var query = String(formData.get("q") || "").trim();
      if (!query) return;

      var isSubmission = Boolean(eventOrForm && eventOrForm.preventDefault);
      if (isSubmission) eventOrForm.preventDefault();
      if (activeSearch) activeSearch.abort();

      var controller = new AbortController();
      controller.progress = searchProgress({{ cl.list_per_page }});
      activeSearch = controller;
      setSearchLoading(controller);
      var searchMessage = setChangelistSearchingState(controller);
      var resultVersion = 0;
      var pendingRender = null;
      var renderInFlight = false;
      var renderPromise = Promise.resolve();
      var renderedVersion = -1;
      var lastRender = 0;
      var failed = false;
      var renderedRows = null;
      var previousSize = 0;
      // Django Actions closes over this array for shift-click and select-all.
      // Keep that binding valid when the stream adds or removes checkboxes.
      var actionCheckboxes = [];
      var renderHeaders = {"X-Requested-With": "XMLHttpRequest", "X-ArchiveBox-Search-Rows": "start"};

      function failSearch(error) {
        if (activeSearch !== controller || controller.signal.aborted || error.name === "AbortError") return;
        failed = true;
        controller.abort();
        clearTimeout(pendingRender);
        clearSearchLoading(controller);
        if (searchMessage?.isConnected) {
          searchMessage.removeAttribute("data-search-pending");
          searchMessage.textContent = error.message || "Search could not finish.";
        } else {
          var status = document.querySelector("#changelist .archivebox-search-stream-status");
          if (status) {
            status.textContent = error.message || "Search could not finish.";
            status.hidden = false;
          }
        }
      }

      function buildListUrl() {
        var url = new URL(window.location.href);
        url.searchParams.set("q", query);
        url.searchParams.set("search_mode", mode);
        if (isSubmission) url.searchParams.delete("p");
        return url;
      }

      function renderNow(firstResponse) {
        clearTimeout(pendingRender);
        pendingRender = null;
        if (controller.signal.aborted || (renderedVersion === resultVersion && !renderInFlight)) return Promise.resolve();
        if (renderInFlight) return renderPromise;
        var url = buildListUrl();
        renderInFlight = true;
        renderedVersion = resultVersion;
        lastRender = Date.now();
        const headers = {...renderHeaders};
        if (!renderedRows) headers["X-ArchiveBox-Search-Fragment"] = "preview";
        renderPromise = (firstResponse ? Promise.resolve(firstResponse) : fetch(url, {headers: headers, signal: controller.signal}))
          .then(async function(response) {
            if (!response.ok) throw new Error("Could not load snapshot results");
            // Fetch the remaining rows even if the producer is already done.
            if (response.headers.has("X-ArchiveBox-Search-More-Rows")) renderedVersion = -1;
            return {html: await response.text(), retained: Number(response.headers.get("X-ArchiveBox-Search-Retained")), cursor: response.headers.get("X-ArchiveBox-Search-Rows")};
          })
          .then(function({html, retained, cursor}) {
            if (controller.signal.aborted) return;
            var doc = searchFragment(html);
            var nextMain = doc.getElementById("content-main");
            var currentMain = document.getElementById("content-main");
            var rowsSelector = '#result_list tbody, .cards';
            var nextRows = nextMain?.querySelector(rowsSelector);
            if (renderedRows?.isConnected && nextRows && renderedRows.tagName === nextRows.tagName) {
              const across = currentMain.querySelector('input.select-across')?.value === '1';
              const added = syncSearchRows(renderedRows, nextRows, retained);
              const boxes = renderedRows.querySelectorAll('input.action-select');
              actionCheckboxes.splice(0, actionCheckboxes.length, ...boxes);
              for (const row of added) {
                const box = row.querySelector('input.action-select');
                if (across && box) {
                  box.checked = true;
                  row.classList.add(row.matches('tr') ? 'selected' : 'selected-card');
                }
              }
              if (added.length || boxes.length !== previousSize) {
                window.archiveboxInitLibraryRows?.(added);
              }
              previousSize = boxes.length;
              const summary = currentMain.querySelector('.action-summary');
              const nextSummary = nextMain.querySelector('.action-summary');
              if (summary && nextSummary) {
                for (const key of ['pageCount', 'resultCount', 'fullResultCount', 'countExact']) {
                  if (summary.dataset[key] !== nextSummary.dataset[key]) summary.dataset[key] = nextSummary.dataset[key];
                }
                const counter = summary.querySelector('.action-counter');
                counter.dataset.actionsIcnt = String(boxes.length);
                const toggle = currentMain.querySelector('#action-toggle');
                if (toggle) toggle.checked = boxes.length > 0 && Array.from(boxes).every(box => box.checked);
                const options = summary.querySelector('.snapshot-across-options');
                if (options) options.hidden = nextSummary.querySelector('.snapshot-across-options').hidden;
                const total = summary.querySelector('.action-total-count');
                const nextTotal = nextSummary.querySelector('.action-total-count');
                if (total.innerHTML !== nextTotal.innerHTML) total.replaceChildren(...nextTotal.childNodes);
                currentMain.querySelector('#changelist-form').dispatchEvent(new Event('change', {bubbles: true}));
              }
              const footer = currentMain.querySelector('.paginator');
              const nextFooter = nextMain.querySelector('.paginator');
              if (footer && nextFooter && !footer.isEqualNode(nextFooter)) footer.replaceWith(nextFooter);
            } else if (nextMain?.querySelector("#changelist") && currentMain) {
              // Capture at replacement time: a user can select rows while this
              // refresh is in flight. New matches inherit an all-results selection.
              var selectedIds = new Set(Array.from(currentMain.querySelectorAll('input.action-select:checked'), function(input) { return input.value; }));
              var selectAcross = currentMain.querySelector('input.select-across')?.value === '1';
              window.archiveboxRefreshLibraryExportLinks?.(doc);
              currentMain.replaceWith(nextMain);
              renderedRows = nextRows;
              previousSize = nextRows?.children.length || 0;
              actionCheckboxes = Array.from(nextMain.querySelectorAll("tr input.action-select"));
              if (window.Actions && actionCheckboxes.length) window.Actions(actionCheckboxes);
              if (window.archiveboxInitAdminChangelist) window.archiveboxInitAdminChangelist();
              if (window.archiveboxInitChangelistFilters) window.archiveboxInitChangelistFilters();
              nextMain.querySelectorAll('input.action-select').forEach(function(input) {
                input.checked = selectAcross || selectedIds.has(input.value);
                input.closest('tr')?.classList.toggle('selected', input.checked);
                input.closest('.card')?.classList.toggle('selected-card', input.checked);
              });
              // Let Django recompute its checkbox/count UI before restoring
              // select_across, which is independent of the current page size.
              var checkbox = nextMain.querySelector('input.action-select');
              if (checkbox) checkbox.dispatchEvent(new Event('change', {bubbles: true}));
              if (selectAcross) nextMain.querySelector('.actions .question a')?.click();
              nextMain.querySelectorAll('input.select-across').forEach(function(input) { input.value = selectAcross ? '1' : '0'; });
              if (selectAcross) nextMain.querySelector('.actions .question a')?.click();
              nextMain.querySelector('#changelist-form')?.dispatchEvent(new Event('change', {bubbles: true}));
              setSearchLoading(controller);
              history.replaceState(null, "", url);
            } else {
              throw new Error("Missing snapshot results");
            }
            renderHeaders["X-ArchiveBox-Search-Rows"] = renderedRows && cursor || "start";
          })
          .catch(failSearch)
          .finally(function() {
            renderInFlight = false;
            if (!controller.signal.aborted && renderedVersion !== resultVersion) renderSoon();
          });
        return renderPromise;
      }

      function renderSoon(force) {
        if (force) return renderNow();
        if (!pendingRender) {
          pendingRender = setTimeout(renderNow, Math.max(0, 300 - (Date.now() - lastRender)));
        }
      }

      var listUrl = buildListUrl();
      // Layout navigation must use the submitted query even while the old
      // toolbar is still displayed and streamed results are in flight.
      history.replaceState(null, "", listUrl);
      window.archiveboxFetchSearch(listUrl, controller)
        .then(async function(response) {
          const generation = response.headers.get("X-ArchiveBox-Search-Generation");
          if (generation) renderHeaders["X-ArchiveBox-Search-Generation"] = generation;
          var token = response.headers.get("X-ArchiveBox-Search-Page");
          if (token) renderHeaders["X-ArchiveBox-Search-Page"] = token;
          if (response.status === 204) return renderNow();
          if (response.status === 400) throw new Error(await response.text());
          if (!response.ok || !response.body || !(response.headers.get("Content-Type") || "").startsWith("text/plain")) {
            throw new Error("Unexpected snapshot search stream response");
          }
          var reader = response.body.getReader();
          var decoder = new TextDecoder();
          var buffer = "";
          function read() {
            return reader.read().then(async function(result) {
              buffer += decoder.decode(result.value || new Uint8Array(), {stream: !result.done});
              var lines = buffer.split("\n");
              buffer = lines.pop();
              lines = lines.map(line => line.trim()).filter(line => line && !controller.progress.work(line));
              for (const line of lines) {
                const first = firstSearchFragment(line);
                if (first) {
                  resultVersion = first.count;
                  await renderNow(first.response);
                }
              }
              lines = lines.filter(line => !line.startsWith('first '));
              lines.forEach(function(count) {
                count = parseInt(count.trim(), 10);
                resultVersion = Number.isFinite(count) ? count : resultVersion + 1;
              });
              if (lines.length) controller.progress.count(resultVersion);
              if (lines.length && resultVersion > 0 && !result.done) renderSoon();
              if (!result.done) return read();
              // A resumed later page needs settled pagination, even if the last
              // count matches a provisional first-page render.
              // SQL waves contain the ordered page plus its lookahead. An
              // unchanged final count already has the correct pagination.
              controller.progress.finishing();
              if (!token) renderedVersion = -1;
              // Keep the progress state until the final table is actually installed.
              // The stream can finish while an earlier wave is still rendering.
              return renderNow().then(function() {
                if (renderedVersion !== resultVersion) return renderNow();
              });
            });
          }
          return read();
        })
        .catch(failSearch)
        .finally(function() {
          if (!failed) clearSearchLoading(controller);
          controller.progress.stop();
          if (activeSearch === controller) activeSearch = null;
        });
    }

    document.addEventListener("input", cancelActiveSearch);
    document.addEventListener("change", cancelActiveSearch);
    document.addEventListener("submit", streamSnapshotSearch);
    {% if not cl.search_stream_complete %}
    var initialForm = document.getElementById("changelist-search");
    if (initialForm && initialForm.tagName === "FORM" && String(new FormData(initialForm).get("q") || "").trim()) {
      streamSnapshotSearch(initialForm);
    }
    {% endif %}
  })();
</script>
{% endif %}
