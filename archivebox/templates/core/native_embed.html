<script>
(() => {
    // The WebView identifies itself; ArchiveBox owns the embedded presentation.
    // A regular mobile Safari/Chrome request keeps the normal web layout.
    if (window !== window.top) return;
    const ua = navigator.userAgent;
    const ios = /\bArchiveBoxNative\/iOS\b/.test(ua);
    const android = /\bArchiveBoxNative\/Android\b/.test(ua);
    if (!ios && !android) return;
    const root = document.documentElement;
    root.classList.add('archivebox-native-mobile');
    {% if native_activity %}root.classList.add('archivebox-native-activity');{% endif %}

    function searchEditor() {
        const form = document.querySelector('#changelist-search, .abx-search-standalone > form[role="search"]');
        if (!form) return;
        const enhanced = form.querySelector('.abx-search-field');
        const field = enhanced?.dataset.ready
            ? enhanced.querySelector('[role="combobox"]')
            : (!enhanced || document.readyState === 'complete') && form.querySelector('input[name="q"], #searchbar');
        if (field && !field.disabled && field.getClientRects().length && getComputedStyle(field).visibility === 'visible') return field;
    }
    // The app invokes this synchronously for an explicit Search tap so the
    // WebView can open its keyboard. Normal visits must not steal focus.
    window.archiveBoxFocusSearch = () => {
        const field = searchEditor();
        if (!field) return document.readyState === 'complete' ? false : null;
        // WKWebView can keep DOM focus after the keyboard is dismissed.
        if (ios && document.activeElement === field) field.blur();
        field.focus();
        return document.activeElement === field;
    };

    if (!ios) return;
    root.classList.add('archivebox-native-app', 'archivebox-ios-app');
    if (/iPhone|iPod/.test(ua)) root.classList.add('archivebox-ios-phone');

    document.addEventListener('DOMContentLoaded', () => {
        if (searchEditor()) window.webkit?.messageHandlers?.archiveBoxNativeSearch?.postMessage('ready');
        const header = document.querySelector('#header');
        const adminBrand = header?.querySelector('#branding a:has(img)');
        const replayBrand = document.querySelector('.header-top .header-archivebox:has(img)');
        const activityBrand = document.querySelector('[data-native-activity-back]');
        const brand = adminBrand || replayBrand || activityBrand;
        if (!brand) return;
        if (activityBrand) activityBrand.parentElement.hidden = false;
        if (adminBrand) {
            let crumbs = document.querySelector('.breadcrumbs');
            if (!crumbs) {
                crumbs = document.createElement('nav');
                crumbs.className = 'breadcrumbs';
                crumbs.setAttribute('aria-label', 'Breadcrumbs');
                crumbs.textContent = document.querySelector('#content h1')?.textContent.trim()
                    || document.title.split('|')[0].trim() || 'ArchiveBox';
            }
            header.append(crumbs);
            header.classList.add('archivebox-app-header');
        }
        brand.href = 'archivebox://back';
        brand.title = 'Back';
        brand.setAttribute('aria-label', 'Back');
        brand.classList.add('archivebox-native-back');
        window.webkit?.messageHandlers?.archiveBoxNativeHeader?.postMessage('ready');
    }, {once: true});
})();
</script>
<style>
    html.archivebox-native-mobile:not(.archivebox-native-activity) #progress-monitor,
    html.archivebox-native-mobile #snapshot-progress-wrapper { display: none !important; }

    html.archivebox-native-mobile.archivebox-ios-app #header.archivebox-app-header {
        min-height: 44px;
        padding: 0 8px !important;
    }
    html.archivebox-native-mobile .archivebox-native-back {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        box-sizing: border-box;
        width: 44px;
        min-height: 44px;
        position: relative;
        font-size: 0 !important;
    }
    html.archivebox-native-mobile .archivebox-native-back::after {
        content: '';
        position: absolute;
        left: 7px;
        top: 50%;
        width: 8px;
        height: 8px;
        border: solid white;
        border-width: 0 0 2px 2px;
        transform: translateY(-50%) rotate(45deg);
        filter: drop-shadow(0 1px 2px #0008);
        pointer-events: none;
    }
</style>
