<style>
  /* Loading Progress Bar */
    #progress {
        position: absolute;
        z-index: 1000;
        top: 0px;
        left: -6px;
        width: 2%;
        opacity: 1;
        height: 2px;
        background: #1a1a1a;
        border-radius: 1px;
        transition: width 4s ease-out, opacity 400ms linear;
    }

    @-moz-keyframes bugfix { from { padding-right: 1px ; } to { padding-right: 0; } }
</style>
<script>
    let progressInterval;
    window.loadStart = function(distance) {
        if (document.getElementById('progress')) return;
        const progress = document.createElement('div');
        progress.id = 'progress';
        document.body.append(progress);
        let position = distance || 30 + Math.random() * 30;
        progress.style.width = position + '%';
        progressInterval = setInterval(function() {
            position += Math.random();
            progress.style.width = position + '%';
        }, 1000);
    };

    window.loadFinish = function() {
        clearInterval(progressInterval);
        const progress = document.getElementById('progress');
        if (!progress) return;
        progress.style.width = '101%';
        window.setTimeout(() => progress.remove(), 600);
    };
    window.loadStart();
    window.addEventListener('beforeunload', function() {window.loadStart(27)});
    document.addEventListener('DOMContentLoaded', function() {window.loadFinish()});
</script>
