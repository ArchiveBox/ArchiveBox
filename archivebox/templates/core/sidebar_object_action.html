{% if action.method == "post" %}<form method="post" action="{{ action.url }}">{% csrf_token %}<button type="submit" role="menuitem">
{% else %}<a role="menuitem" href="{{ action.url }}">{% endif %}
{% if action.icon_url %}<img class="library-object-icon" src="{{ action.icon_url }}" alt="" loading="lazy">
{% elif action.icon_symbol %}<svg class="folder-menu-icon" aria-hidden="true"><use href="#{{ action.icon_symbol }}"/></svg>{% endif %}
<span class="folder-menu-label">{{ action.label }}</span>
{% if action.method == "post" %}</button></form>{% else %}</a>{% endif %}
