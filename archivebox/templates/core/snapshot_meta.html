<link rel="canonical" href="{{ canonical }}">
<meta name="description" content="{{ description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ArchiveBox">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
{% if url %}<meta property="og:url" content="{{ url }}">{% endif %}
<meta name="twitter:card" content="{% if image %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
{% if image %}
<meta property="og:image" content="{{ image }}">
<meta property="og:image:alt" content="Screenshot of {{ title }}">
<meta name="twitter:image" content="{{ image }}">
<meta name="twitter:image:alt" content="Screenshot of {{ title }}">
{% endif %}
