  <dialog id="tag-merge-dialog" aria-labelledby="tag-merge-title" data-max-tags="{{ merge_max_tags }}">
    <form {% if sidebar_merge %}method="post" action="{% url 'admin:core_tag_changelist' %}" data-sidebar-merge data-search-url="{{ sidebar_url }}"{% else %}method="dialog"{% endif %}>
      {% if sidebar_merge %}{% csrf_token %}<input type="hidden" name="action" value="merge_tags"><input type="hidden" name="index" value="0"><input type="hidden" name="select_across" value="0"><input type="hidden" name="_selected_action" data-merge-source><input type="hidden" name="confirm_tag_merge" value="1"><input type="hidden" name="confirm_tag_merge_count" value="2"><p><label for="tag-merge-search">Merge with</label><br><input id="tag-merge-search" type="search" placeholder="Find a tag…" autocomplete="off"><br><select id="tag-merge-target" aria-label="Choose tag to merge" name="_selected_action" required><option value="">Choose a tag…</option>{% for entry in sidebar_entries %}<option value="{{ entry.id }}">{{ entry.name }}</option>{% endfor %}</select></p>{% endif %}
      <h2 id="tag-merge-title">Merge Tags</h2>
      <p>Merge <strong id="tag-merge-count"></strong> selected tags into the name below. An existing tag with that name is kept. The other selected tags are retired; all snapshots are kept.</p>
      <p>Scripts and bookmarks that refer to an old tag name are not updated.</p>
      <p><label for="tag-merge-name">Final tag name</label><br><input id="tag-merge-name" name="{% if sidebar_merge %}merge_tag_name{% else %}merge_name{% endif %}" maxlength="100" autocomplete="off" required autofocus></p>
      <div class="submit-row">
        <button type="button" data-tag-merge-cancel>Cancel</button>
        <button type="submit" class="default">Merge Tags</button>
      </div>
    </form>
  </dialog>
