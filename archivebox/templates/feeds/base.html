{% extends "admin/base_site.html" %}
{% block extrastyle %}{{ block.super }}<style>
body #content .feeds form > .feed-field{display:block;gap:0}body #content .feeds form > .feed-check{display:flex;flex-wrap:nowrap;gap:12px;align-items:flex-start}body #content .feeds form > .feed-form-actions{gap:12px;align-items:center}
.feeds{--feed-accent:var(--archivebox-accent,#a51c50);max-width:1200px;margin:28px auto;padding:0 24px;color:var(--body-fg)}.feeds *{box-sizing:border-box}.feeds h1{font-size:30px;letter-spacing:-.7px;margin:5px 0 10px;font-weight:700}.feeds h2{font-size:18px;letter-spacing:-.2px;margin:0 0 8px;font-weight:650}.feeds h3{font-size:15px;margin:0 0 6px}.feeds p{line-height:1.6;margin:0 0 16px}.feeds .muted{color:var(--body-quiet-color)}.feeds .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--feed-accent);margin:0}.feeds .intro{max-width:700px}
.feeds-grid{display:grid;grid-template-columns:minmax(280px,400px) minmax(0,1fr);gap:28px;margin-top:28px;align-items:start}.feed-card{border:1px solid var(--hairline-color);border-radius:14px;padding:24px;background:var(--body-bg);box-shadow:0 2px 6px #00000003}.feeds .section-heading{display:flex;gap:12px;align-items:center;margin-bottom:22px}.feeds .section-heading p{margin:4px 0 0;font-size:13px}.feeds .feed-icon{display:flex;align-items:center;justify-content:center;flex:0 0 42px;width:42px;height:42px;border-radius:12px;color:var(--feed-accent);background:var(--darkened-bg)}.feeds .feed-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.feeds .feed-field{margin:0 0 20px}.feeds label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.feeds input:not([type=checkbox]){width:100%;min-width:0;padding:11px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--body-bg);color:var(--body-fg);font:inherit;font-size:14px}.feeds input:focus{outline:2px solid var(--feed-accent);outline-offset:2px}.feeds .helptext{display:block;font-size:12px;color:var(--body-quiet-color);line-height:1.55;margin:7px 0 0}.feeds .errorlist{padding:0;margin:8px 0;list-style:none;color:var(--error-fg);font-size:13px}.feeds button,.feeds .feed-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:10px 16px;border-radius:8px;background:var(--feed-accent);color:white;border:1px solid transparent;font:inherit;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}.feeds button:hover,.feeds .feed-button:hover{filter:brightness(.95)}.feeds .feed-subscribe button{width:100%}.feeds .feed-secondary{background:var(--body-bg);border-color:var(--border-color);color:var(--body-fg)}.feeds .feed-footer{border-top:1px solid var(--hairline-color);padding-top:18px;margin-top:24px;font-size:13px}.feeds .feed-footer a{display:block;line-height:1.8}.feeds details{border:1px solid var(--hairline-color);border-radius:8px;padding:12px 14px;margin-bottom:20px}.feeds summary{font-size:13px;font-weight:600;cursor:pointer}.feeds details[open] summary{margin-bottom:18px}.feeds details .feed-field:last-child{margin-bottom:4px}
.feeds .feed-table{width:100%;border-collapse:collapse}.feeds .feed-table th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--body-quiet-color);background:transparent;padding:0 10px 12px}.feeds .feed-table td{padding:16px 10px;border-bottom:1px solid var(--hairline-color);font-size:13px;background:transparent;vertical-align:middle}.feeds .feed-table th:first-child,.feeds .feed-table td:first-child{padding-left:0}.feeds .feed-table tr:last-child td{border-bottom:0}.feeds .feed-table td a{font-weight:600}.feeds .feed-badge{display:inline-block;white-space:nowrap;font-size:11px;font-weight:600;background:var(--darkened-bg);border:1px solid var(--hairline-color);border-radius:20px;padding:4px 9px}.feeds .export-heading{margin:30px 0 18px}.feeds .export-heading p{font-size:13px;margin:7px 0 0}.feeds .feed-export{margin-bottom:16px}.feeds .feed-export-header{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}.feeds .feed-url{font-size:12px;background:var(--darkened-bg);border:1px solid var(--hairline-color);padding:12px;border-radius:8px;margin:16px 0;overflow-wrap:anywhere;line-height:1.65}.feeds .visibility{font-size:12px;color:var(--body-quiet-color);margin:6px 0 0}.feeds .feed-export-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px}.feeds .feed-export-footer button{font-size:12px;min-height:34px;padding:7px 11px}.feeds .empty-state{padding:20px 0;color:var(--body-quiet-color);font-size:13px}.feeds .export-panel{max-width:680px;margin:28px 0}.feeds .feed-check{display:flex;align-items:flex-start;gap:12px;margin:24px 0}.feeds .feed-check input{width:17px;height:17px;margin:2px 0;accent-color:var(--feed-accent);flex-shrink:0}.feeds .feed-check label{margin:0}.feeds .feed-check .helptext{font-weight:400}.feeds .feed-notice{background:var(--darkened-bg);border-radius:10px;padding:16px 18px;font-size:13px}.feeds .feed-form-actions{display:flex;gap:12px;align-items:center;margin-top:24px}.feeds a{overflow-wrap:anywhere}
@media(max-width:850px){.feeds-grid{grid-template-columns:minmax(0,1fr)}}@media(max-width:600px){.feeds{padding:0 12px;margin:20px auto}.feeds h1{font-size:26px}.feeds-grid{gap:20px;margin-top:22px}.feed-card{padding:18px;border-radius:12px}.feeds .feed-table thead{display:none}.feeds .feed-table tr{display:flex;flex-wrap:wrap;gap:7px 14px;border-bottom:1px solid var(--hairline-color);padding:16px 0}.feeds .feed-table tr:last-child{border:0}.feeds .feed-table td{border:0;padding:0}.feeds .feed-table td:first-child{flex-basis:100%;margin-bottom:4px}.feeds .feed-export-footer{align-items:flex-start}.feeds .feed-export-header{display:block}.feeds .feed-export-header .feed-badge{margin-top:10px}.feeds .feed-form-actions{flex-wrap:wrap}}
.feeds .feed-manage{display:block;margin-top:7px;font-size:12px}.feeds .feed-status-failed,.feeds .feed-status-needs_login{color:var(--error-fg)}.feeds .feed-status-running,.feeds .feed-status-queued{color:var(--feed-accent)}.feeds .feed-copy-status:empty{display:none}.feeds .feed-table .helptext{font-size:11px;margin-bottom:0}
</style>{% endblock %}
{% block content %}<main class="feeds">{% block feeds_content %}{% endblock %}</main>{% endblock %}
