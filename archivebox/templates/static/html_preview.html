<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
        html, body { margin: 0; padding: 0; }
        /* Render incoming HTML before load; natural height replaces this viewport. */
        #document { display: block; width: 100%; height: 100vh; border: 0; }
    </style>
</head>
<body>
    <iframe id="document" title="Saved page" data-src="{{ document_url }}"></iframe>
    <script>
    (() => {
        const frame = document.getElementById('document');
        let observer;
        frame.addEventListener('load', () => {
            observer?.disconnect();
            const doc = frame.contentDocument;
            if (!doc?.body) return;
            // Change only the rendered document, never the saved artifact.
            // Natural root height allows both growth and shrinkage without
            // measuring the viewport that this callback is itself resizing.
            const style = doc.createElement('style');
            style.textContent = 'html,body{height:auto!important;min-height:0!important}body{display:flow-root}';
            doc.head.append(style);
            let bounded = false;
            const measure = () => {
                const margins = frame.contentWindow.getComputedStyle(doc.body);
                return Math.ceil(doc.body.getBoundingClientRect().height +
                    parseFloat(margins.marginTop) + parseFloat(margins.marginBottom));
            };
            const resize = () => {
                if (bounded) return;
                const height = measure();
                if (height > 0 && frame.style.height !== `${height}px`) frame.style.height = `${height}px`;
                // Measure the consequence of our own resize before publishing it.
                // A viewport-sized descendant plus a footer has no intrinsic
                // height: expanding its viewport expands its content forever.
                if (height > 0 && Math.abs(measure() - height) > 1) {
                    bounded = true;
                    observer?.disconnect();
                    style.remove();
                    frame.style.height = '100vh';
                    frame.dataset.sizeMode = 'viewport';
                    if (window.name === 'preview') parent.postMessage({type: 'archivebox-preview-height', bounded: true}, '*');
                    return;
                }
                // The wrapper can be below a tall output tray, where Chrome
                // defers ResizeObserver delivery until it becomes visible.
                if (height > 0 && window.name === 'preview') parent.postMessage({type: 'archivebox-preview-height', height}, '*');
            };
            observer = new ResizeObserver(resize);
            observer.observe(doc.body);
            doc.addEventListener('load', resize, true);
            frame.contentWindow.addEventListener('resize', resize);
            doc.fonts.ready.then(resize);
            resize();
        });
        frame.src = frame.dataset.src + location.hash;
        window.addEventListener('pagehide', () => observer?.disconnect(), {once: true});
    })();
    </script>
</body>
</html>
