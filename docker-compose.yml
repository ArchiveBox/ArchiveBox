# Usage
#
#     mkdir -p ~/archivebox/data && cd ~/archivebox
#     curl -fsSL 'https://docker-compose.archivebox.io' > docker-compose.yml
#     docker compose up -d
#     Open /admin/ on the hostname or IP used to reach ArchiveBox e.g: http://admin.archivebox.localhost:5797/
#
#     docker compose exec archivebox archivebox add --depth=1 'https://news.ycombinator.com'
#     docker compose exec -T archivebox archivebox add < ~/Downloads/bookmarks.txt
#     docker compose exec archivebox archivebox help
#
# More Info: https://github.com/ArchiveBox/ArchiveBox/wiki/Docker#docker-compose

services:
    archivebox:
        image: ${ARCHIVEBOX_IMAGE:-archivebox/archivebox:latest}
        restart: unless-stopped
        ports:
            - "${ARCHIVEBOX_PORT:-5797}:5797"
        volumes:
            # Required: main data directory must be on a fast local SSD
            - ./data:/data
            # Optional: store the bulky data/archive content on a slower HDD or remote network store
            # - /mnt/archivebox/data/archive:/data/archive
            # Recommended: lets one-off `docker compose run` commands reuse main server's runners
            - tmp:/tmp/archivebox
        environment:
            - PUID                                               # optional numeric UID for NFS/CIFS/FUSE mounts (defaults to collection owner or 911)
            - PGID                                               # optional numeric GID for NFS/CIFS/FUSE mounts (defaults to collection group or 911)
            # - ADMIN_USERNAME=admin                             # optional admin user to create on first run, skips first-time setup admin creation UI
            # - ADMIN_PASSWORD=SomeSecretPassword
            - BASE_URL                                           # canonical URL users will access this server at, can be set up via first-run wizard in the UI as well
            - SERVER_SECURITY_MODE                               # defaults to "auto", can be set up via first-run wizard in the UI as well
            - PUBLIC_ADD_VIEW=False                              # set to True to allow anonymous users to submit new URLs to archive
            # For all other options, it's better to use data/ArchiveBox.conf or the new Personas config feature in the admin UI...
            # - TIMEOUT=60
            # - CHECK_SSL_VALIDITY=False
            # - USER_AGENT="..."
            # - ARCHIVEBOX_VNC_PERSONA=personal                  # optional persona to open/configure when using novnc below (defaults to DEFAULT_PERSONA)
            # ...
            # For more info, see: https://github.com/ArchiveBox/ArchiveBox/wiki/Docker#configuration
        shm_size: "1gb"                                          # chrome runs better when it can use a decently sized shm pool
        pids_limit: 2048                                         # avoids low systemd task caps with Chrome and parallel extractors


####################################################################################################################
    ### No Separate containers are needed for sonic or scheduled archiving, these are all optional addons: ###

    ### Optional: HTTPS ingress using Cloudflare
    #             https://developers.cloudflare.com/tunnel/reference/run-parameters/
    #
    # cloudflared:
    #     image: cloudflare/cloudflared
    #     command: tunnel --no-autoupdate --loglevel debug --retries 15 --protocol http2 --overwrite-dns --url http://archivebox:5797 --hostname archivebox.io --name archivebox.io
    #     volumes:                                                                                                                 # ^ (replace archivebox.io with your own domain)
    #         # Download a cert.pem into this folder from https://dash.cloudflare.com/argotunnel
    #         - ./etc/cloudflared:/etc/cloudflared
    

    ### Optional: ArchiveBox Bot + ArchiveBox AI Bot: save links and run archiving tasks from Slack, WhatsApp, etc.
    #             https://github.com/ArchiveBox/archivebox-chat-bot
    #
    # archivebox-chat-bot:
    #     build: https://github.com/ArchiveBox/archivebox-chat-bot.git#main
    #     restart: unless-stopped
    #     ports:
    #         - "127.0.0.1:5798:5798"
    #         # Open http://localhost:5798, choose a console password, then connect to http://archivebox:5797 with your API key.
    #     volumes:
    #         - ./archivebox-chat-bot:/data
    #     # Optional: set ADMIN_PASSWORD to skip the first-run password setup UI.
    #     # environment:
    #     #     ADMIN_PASSWORD: your-console-password


    ### Optional: container to run xvfb+noVNC so you can watch the ArchiveBox browser screen as it archives things /
    #             remote control it to set up a chrome profile w/ logins for sites you want to archive
    # 
    #             https://github.com/ArchiveBox/ArchiveBox/wiki/Chromium-Install#setting-up-a-chromium-user-profile
    #             https://github.com/ArchiveBox/ArchiveBox/wiki/Chromium-Install#docker-vnc-setup
    #
    # novnc:
    #     image: theasp/novnc:latest
    #     environment:
    #         - DISPLAY_WIDTH=1920
    #         - DISPLAY_HEIGHT=1080
    #         - RUN_XTERM=no
    #     healthcheck:
    #         test: ["CMD", "xdpyinfo", "-display", ":0"]
    #         interval: 2s
    #         timeout: 2s
    #         retries: 10
    #     ports:
    #         # to view/control ArchiveBox's browser, visit: http://127.0.0.1:8080/vnc.html
    #         # restricted to access from localhost by default because it has no authentication
    #         - 127.0.0.1:8080:8080


    ### Optional: run all your ArchiveBox server traffic your home IP to avoid rate limits and captchas
    #             https://tailscale.com/docs/features/containers/docker/how-to/connect-docker-container
    # tailscale:
    # image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: tailscale-nginx
    environment:
      - TS_AUTHKEY=<tskey-YOUR-AUTH-KEY>
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

    ### Example: Run ChangeDetection.io to watch for changes to websites, then trigger ArchiveBox to archive them
    # Documentation: https://github.com/dgtlmoon/changedetection.io
    # More info: https://github.com/dgtlmoon/changedetection.io/blob/master/docker-compose.yml

