# Usage:
#     mkdir -p ~/archivebox/data && cd ~/archivebox
#     curl -fsSL 'https://docker-compose.archivebox.io' > docker-compose.yml
#     docker compose pull
#     docker compose up -d --wait
#     Open /admin/ on the hostname or IP used to reach ArchiveBox (local: http://admin.archivebox.localhost:8000/admin/).

#     docker compose exec archivebox archivebox add --depth=1 'https://news.ycombinator.com'
#     docker compose exec -T archivebox archivebox add < ~/Downloads/bookmarks.txt
#     docker compose exec archivebox archivebox help
# Documentation:
#     https://github.com/ArchiveBox/ArchiveBox/wiki/Docker#docker-compose

services:
    archivebox:
        image: ${ARCHIVEBOX_IMAGE:-archivebox/archivebox:dev}
        restart: unless-stopped
        ports:
            - "${ARCHIVEBOX_PORT:-8000}:8000"
        volumes:
            - ./data:/data
            # Override abx-dl's nested VOLUME so profiles persist across containers.
            - ./data/personas:/data/personas
            # Let one-off `docker compose run` commands reuse the server's supervisor.
            - tmp:/tmp/archivebox
        pids_limit: 2048                       # avoids low systemd task caps with Chrome and parallel extractors
        environment:
            # - ADMIN_USERNAME=admin                             # creates an admin user on first run with the given user/pass combo
            # - ADMIN_PASSWORD=SomeSecretPassword
            - BASE_URL                                                               # optional canonical URL; the first-run admin wizard fills it from the browser
            - SERVER_SECURITY_MODE                                                   # optional override; defaults to auto and can be set by the first-run wizard
            - PUBLIC_ADD_VIEW=False                              # set to True to allow anonymous users to submit new URLs to archive
            # For all other options, it's better to use data/ArchiveBox.conf or the new Personas config feature in the admin UI...
            # - TIMEOUT=60
            # - CHECK_SSL_VALIDITY=False
            # - USER_AGENT="..."
            # ...
            # For more info, see: https://github.com/ArchiveBox/ArchiveBox/wiki/Docker#configuration
        shm_size: "1gb"                         # Chrome runs more efficiently when using a reasonably sized shared memory pool
            



####################################################################################################################
    ######## Optional Addons: tweak examples below as needed for your specific use case ########

    ### `archivebox server` now runs the orchestrator itself, so scheduled crawls and queued UI/API jobs
    # are processed by the main container without needing a separate scheduler sidecar. To add a new job:
    #   $ docker compose run --rm archivebox schedule --add --every=day --depth=1 'https://example.com/some/rss/feed.xml'
    # the running server orchestrator will pick it up automatically at the next due time.
    # https://github.com/ArchiveBox/ArchiveBox/wiki/Scheduled-Archiving


    ### ArchiveBox now starts and uses Sonic automatically when SEARCH_BACKEND_ENGINE=sonic.
    # If Sonic is ever started after not running for a while, update its full-text index by running:
