authentication = ["docs/Setting-up-Authentication.md"]
search = ["docs/Setting-up-Search.md"]
troubleshooting = ["docs/Troubleshooting.md"]
usage = [
    "docs/Upgrading.md",
    "docs/Usage.md",
]

[ci.bsd]
