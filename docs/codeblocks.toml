version = 1
environments = ["core", "merge", "publishing", "docker", "root", "macos", "freebsd", "openbsd"]

[syntax]
executed = ["bash", "sh", "python"]
shell_syntax_only = ["console"]
structured = ["json", "yaml", "ini", "sql", "nginx", "mermaid"]
prose = ["text"]
directive_prefixes = ["{"]
console_blocks = [
    "README.md::line 489",
    "README.md::line 1400",
    "README.md::line 1421",
    "README.md::line 1436",
    "README.md::line 1466",
    "README.md::line 1490",
    "README.md::line 1500",
    "README.md::line 1524",
    "README.md::line 1537",
    "README.md::line 1601",
]

[ci.standard]
core = "ubuntu-24.04"
merge = "ubuntu-24.04"
publishing = "ubuntu-24.04"
docker = "ubuntu-24.04"
root = "ubuntu-24.04"
macos = "macos-15"

[ci.core_shards]
metadata = [
    "README.md",
    "archivebox/mcp/README.md",
    "docs/Changelog.md",
    "docs/Chromium-Install.md",
]
agents = [
    "AGENTS.md",
    "skills/archivebox/SKILL.md",
]
guides = [
    "docs/Quickstart.md",
    "docs/Scheduled-Archiving.md",
    "docs/Security-Overview.md",
    "docs/Setting-Up-Storage.md",
]
configuration = ["docs/Configuration.md"]
